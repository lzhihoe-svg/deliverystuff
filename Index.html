<style>
  :root {
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --orange: #ea580c;
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    padding-bottom: 96px; /* room for bottom nav */
    overscroll-behavior-y: contain;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: #0f172a; color: #fff;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; }
  .lang-btn {
    border: 1px solid rgba(255,255,255,.4); background: none; color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* ---------- bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: #fff; border-top: 1px solid #e2e8f0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; padding: 8px 0 10px;
    font-size: 12px; color: var(--muted); position: relative; cursor: pointer;
  }
  nav button .ico { display: block; font-size: 26px; line-height: 1.2; }
  nav button.active { color: var(--blue); font-weight: 700; }
  nav button .badge {
    position: absolute; top: 2px; right: 22%;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    line-height: 18px; padding: 0 4px; display: none;
  }

  /* ---------- generic ---------- */
  .page { display: none; padding: 14px; max-width: 560px; margin: 0 auto; }
  .page.active { display: block; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 16px; grid-column: 1 / -1; }
  .empty .big { font-size: 52px; display: block; margin-bottom: 10px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 6px; }

  .card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(15,23,42,.08);
    display: flex; flex-direction: column;
  }
  .card img.job { width: 100%; display: block; background: #e2e8f0; min-height: 120px; max-height: 340px; object-fit: contain; cursor: pointer; }
  .card .body { padding: 12px 14px; display: flex; flex-direction: column; flex: 1; }
  .card .note { font-size: 16px; margin-bottom: 8px; white-space: pre-wrap; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .spacer { flex: 1; }

  .chip {
    display: inline-block; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 12px; margin-bottom: 8px;
  }
  .chip.lalamove { background: #ffedd5; color: #9a3412; }
  .chip.bus      { background: #dbeafe; color: #1e40af; }
  .chip.pickup   { background: #dcfce7; color: #166534; }
  .chip.old      { background: #fee2e2; color: #991b1b; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px;
    padding: 16px; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
  }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn.blue { background: var(--blue); }
  .btn.gray { background: #94a3b8; }
  .btn.small { padding: 10px; font-size: 15px; border-radius: 10px; }
  .btn:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  /* small outline edit/delete buttons on every card */
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button {
    flex: 1; background: #fff; border-radius: 10px; padding: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tools .t-edit { border: 2px solid var(--blue); color: var(--blue); }
  .tools .t-del  { border: 2px solid var(--red); color: var(--red); }
  .tools .t-arch { border: 2px solid #94a3b8; color: #64748b; }

  /* ---------- swipe stack (tab 1) ---------- */
  .stack-outer { max-width: 420px; margin: 0 auto; }
  .stack-wrap { position: relative; height: 58vh; max-height: 480px; margin-bottom: 12px; }
  .swipe-card {
    position: absolute; inset: 0; background: #fff; border-radius: 18px;
    box-shadow: 0 4px 16px rgba(15,23,42,.15); overflow: hidden;
    display: flex; flex-direction: column; touch-action: none; user-select: none;
  }
  .swipe-card img { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #0f172a; pointer-events: none; }
  .swipe-card .foot { padding: 8px 12px; background: #fff; }
  .swipe-card .foot .cap { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stamp {
    position: absolute; top: 24px; font-size: 40px; font-weight: 900;
    padding: 6px 18px; border: 5px solid; border-radius: 12px; opacity: 0;
    transform: rotate(-12deg); pointer-events: none;
  }
  .stamp.yes { left: 16px; color: var(--green); border-color: var(--green); }
  .stamp.no  { right: 16px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .swipe-help { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }

  /* ---------- category pills (tab 2) ---------- */
  .pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .pills button {
    border: 2px solid #cbd5e1; background: #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; color: var(--muted);
    white-space: nowrap; cursor: pointer;
  }
  .pills button.active { border-color: var(--blue); background: var(--blue); color: #fff; }

  /* ---------- two-photo layout (tab 3) ---------- */
  .photo-pair { display: flex; gap: 2px; background: #e2e8f0; }
  .photo-pair > div { flex: 1; position: relative; }
  .photo-pair img { width: 100%; display: block; min-height: 120px; max-height: 260px; object-fit: contain; background: #e2e8f0; cursor: pointer; }
  .photo-pair .lbl {
    position: absolute; top: 6px; left: 6px; background: rgba(15,23,42,.75);
    color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }

  .proof { display: flex; align-items: center; gap: 10px; background: #f0fdf4; border-radius: 10px; padding: 8px; margin-top: 10px; }
  .proof img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; }
  .proof .txt { font-size: 13px; color: #166534; font-weight: 600; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 16px; bottom: 92px; z-index: 25;
    height: 62px; min-width: 62px; border-radius: 999px; border: 0;
    background: var(--blue); color: #fff; font-size: 32px;
    box-shadow: 0 4px 14px rgba(37,99,235,.5); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0 18px;
  }
  .fab .fab-txt { display: none; font-size: 18px; font-weight: 800; margin-left: 6px; }

  /* ---------- modals (always centered) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .sheet {
    position: relative; background: #fff; width: 100%; max-width: 480px;
    border-radius: 20px; padding: 22px 18px; max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 19px; margin-bottom: 14px; padding-right: 40px; }
  .sheet label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .sheet textarea {
    width: 100%; border: 2px solid #cbd5e1; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit;
  }
  .x-close {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: #f1f5f9; color: #475569; font-size: 18px; font-weight: 700;
    cursor: pointer; line-height: 38px;
  }
  .x-close:active { background: #e2e8f0; }

  .photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 2px dashed #94a3b8; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; color: var(--muted);
    background: #f8fafc; cursor: pointer;
  }
  .photo-btn.hasphoto { border-style: solid; border-color: var(--green); color: var(--green); background: #f0fdf4; }
  .photo-btn img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  input[type=file] { display: none; }

  .choice-row { display: flex; gap: 10px; }
  .choice-row button {
    flex: 1; border: 2px solid #cbd5e1; background: #fff; border-radius: 14px;
    padding: 16px 8px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .choice-row button.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }
  .choice-row .big { display: block; font-size: 34px; margin-bottom: 4px; }

  /* ---------- toast & spinner ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; z-index: 90; display: none; max-width: 90%;
  }
  #spinner {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; background: rgba(255,255,255,.6);
  }
  #spinner .ring {
    width: 54px; height: 54px; border-radius: 50%;
    border: 6px solid #cbd5e1; border-top-color: var(--blue);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70; display: none; align-items: center; justify-content: center; }
  .viewer.show { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; }

  /* ================= DESKTOP ================= */
  @media (min-width: 700px) {
    .page { max-width: 1100px; padding: 20px 24px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    nav {
      left: 50%; right: auto; transform: translateX(-50%);
      width: 440px; bottom: 18px; border-radius: 999px;
      border: 1px solid #e2e8f0; box-shadow: 0 8px 28px rgba(15,23,42,.18);
      overflow: hidden; padding-bottom: 0;
    }
    nav button { padding: 10px 0 12px; }
    .fab { right: 32px; bottom: 32px; }
    .fab .fab-txt { display: inline; }
    .pills button { padding: 10px 22px; }
    .stack-outer { max-width: 440px; }
    body { padding-bottom: 110px; }
  }
  @media (min-width: 1050px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>

<header>
  <h1>🏭 Kilang App</h1>
  <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">🌐 BM</button>
</header>

<!-- ================= TAB 1 : KILANG WANT ================= -->
<div class="page" id="page-want">
  <div id="want-stack-area"></div>
  <div id="want-responded"></div>
</div>

<!-- ================= TAB 2 : DELIVERY ================= -->
<div class="page" id="page-delivery">
  <div class="pills" id="delivery-pills">
    <button data-cat="" class="active" id="pill-all">Semua</button>
    <button data-cat="lalamove">🛵 Lalamove</button>
    <button data-cat="bus">🚌 Bus</button>
    <button data-cat="pickup">🤝 Pickup</button>
  </div>
  <div id="delivery-list"></div>
</div>

<!-- ================= TAB 3 : POSTAGE ================= -->
<div class="page" id="page-postage">
  <div id="postage-list"></div>
</div>

<!-- ================= BOTTOM NAV ================= -->
<nav>
  <button id="nav-want" onclick="switchTab('want')">
    <span class="ico">🧵</span><span class="nav-lbl" id="navlbl-want">Jahit</span>
    <span class="badge" id="badge-want"></span>
  </button>
  <button id="nav-delivery" onclick="switchTab('delivery')">
    <span class="ico">🚚</span><span class="nav-lbl" id="navlbl-delivery">Hantar</span>

  </button>
  <button id="nav-postage" onclick="switchTab('postage')">
    <span class="ico">📦</span><span class="nav-lbl" id="navlbl-postage">Pos</span>
    <span class="badge" id="badge-postage"></span>
  </button>
</nav>

<button class="fab" id="fab" onclick="openUpload(null)">＋<span class="fab-txt" id="fab-txt">Post</span></button>

<!-- ================= LANGUAGE MODAL (first launch) ================= -->
<div class="overlay" id="lang-overlay">
  <div class="sheet" style="text-align:center">
    <button class="x-close" onclick="closeLang()">✕</button>
    <h2 style="padding-right:0">🌐 Pilih Bahasa / Choose Language</h2>
    <div class="choice-row" style="margin-top:8px">
      <button onclick="setLang('bm')"><span class="big">🇲🇾</span>Bahasa Melayu</button>
      <button onclick="setLang('en')"><span class="big">🇬🇧</span>English</button>
    </div>
  </div>
</div>

<!-- ================= UPLOAD / EDIT MODAL ================= -->
<div class="overlay" id="upload-overlay">
  <div class="sheet">
    <button class="x-close" onclick="closeUpload()">✕</button>
    <h2 id="upload-title"></h2>

    <div id="upload-cat-wrap" style="display:none">
      <label id="lbl-method"></label>
      <div class="choice-row" id="upload-cats">
        <button data-cat="lalamove" onclick="pickCat(this)"><span class="big">🛵</span>Lalamove</button>
        <button data-cat="bus" onclick="pickCat(this)"><span class="big">🚌</span>Bus</button>
        <button data-cat="pickup" onclick="pickCat(this)"><span class="big">🤝</span>Pickup</button>
      </div>
    </div>

    <label id="photo1-label"></label>
    <button class="photo-btn" id="photo1-btn" onclick="document.getElementById('photo1-file').click()"></button>
    <input type="file" id="photo1-file" accept="image/*" onchange="photoPicked(this, 1)">

    <div id="photo2-wrap" style="display:none">
      <label id="photo2-label"></label>
      <button class="photo-btn" id="photo2-btn" onclick="document.getElementById('photo2-file').click()"></button>
      <input type="file" id="photo2-file" accept="image/*" onchange="photoPicked(this, 2)">
    </div>

    <label id="lbl-note"></label>
    <textarea id="upload-note" rows="2"></textarea>

    <div class="btn-row">
      <button class="btn gray" id="btn-cancel" onclick="closeUpload()"></button>
      <button class="btn blue" id="btn-submit" onclick="submitUpload()"></button>
    </div>
  </div>
</div>

<!-- ================= PROOF PHOTO (staff confirm) ================= -->
<input type="file" id="proof-file" accept="image/*" capture="environment" onchange="proofPicked(this)">

<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewer-img"></div>
<div id="toast"></div>
<div id="spinner"><div class="ring"></div></div>

<script>
  // ------------------------------------------------------------ translations
  var STR = {
    bm: {
      nav_want: 'Jahit', nav_delivery: 'Hantar', nav_postage: 'Pos',
      pill_all: 'Semua', fab: 'Post',
      swipe_help: '👈 ❌ Belum nampak &nbsp;|&nbsp; ❤️ Dah ambil, tengah jahit 👉',
      empty_want: 'Tiada jobsheet baru!', empty_list: 'Tiada kerja lagi.',
      btn_notseen: '❌ Belum Nampak', btn_got: '❤️ Dah Ambil',
      sec_status: '📋 Status Jobsheet',
      st_sewing: '❤️ Tengah jahit', st_notseen: '❌ Belum nampak',
      btn_found: '❤️ Dah jumpa, tengah jahit',
      btn_edit: '✏️ Edit', btn_delete: '🗑️ Padam', btn_archive: '🗄️ Simpan',
      sec_todo: '⏳ Belum Siap', sec_done: '✅ Siap',
      chip_old: '⚠️ Lebih 1 hari!',
      lbl_jobsheet: '📄 Jobsheet', lbl_awb: '🏷️ Airway Bill',
      btn_proof: '📸 Siap! Ambil Gambar Bukti',
      proof_done: '✅ Siap', posted: 'Dipos', remaining: 'baki',
      up_want: '🧵 Post Jobsheet Baru', up_delivery: '🚚 Post Arahan Penghantaran',
      up_postage: '📦 Post Airway Bill + Jobsheet', edit_title: '✏️ Edit Job',
      lbl_method: 'Cara hantar',
      lbl_photo_job: 'Gambar Jobsheet 📸', lbl_photo_awb: 'Gambar Airway Bill (J&T) 📸',
      btn_takephoto: '📷 Ambil / Pilih Gambar', photo_ok: '✅ Gambar OK — tukar?',
      photo_keep: '📷 Gambar sedia ada — tukar?',
      lbl_note: 'Arahan (tak wajib)', note_ph: 'Contoh: Hantar sebelum 5pm',
      btn_cancel: 'Batal', btn_post: '📤 Post', btn_save: '💾 Simpan',
      toast_posted: '📤 Sudah post!', toast_saved: '💾 Sudah simpan!',
      toast_deleted: '🗑️ Sudah padam.', toast_archived: '🗄️ Disimpan.',
      toast_got: '❤️ Bagus! Tengah jahit.', toast_notseen: '❌ Office akan follow-up.',
      toast_done: '✅ Siap! Terima kasih 🙏',
      toast_needphoto: 'Sila ambil gambar dulu 📸',
      toast_needcat: 'Pilih cara hantar dulu 🛵🚌🤝',
      toast_need2: 'Perlu 2 gambar: jobsheet + airway bill 📸',
      confirm_delete: 'Padam job ini? Tidak boleh undo!',
      ago_now: 'baru sahaja', ago_min: ' min lalu', ago_hour: ' jam lalu', ago_day: ' hari lalu'
    },
    en: {
      nav_want: 'Sewing', nav_delivery: 'Delivery', nav_postage: 'Postage',
      pill_all: 'All', fab: 'Post',
      swipe_help: '👈 ❌ Not seen &nbsp;|&nbsp; ❤️ Got it, sewing now 👉',
      empty_want: 'No new jobsheets!', empty_list: 'Nothing here yet.',
      btn_notseen: '❌ Not Seen', btn_got: '❤️ Got It',
      sec_status: '📋 Jobsheet Status',
      st_sewing: '❤️ Sewing now', st_notseen: '❌ Not seen yet',
      btn_found: '❤️ Found it, sewing now',
      btn_edit: '✏️ Edit', btn_delete: '🗑️ Delete', btn_archive: '🗄️ Hide',
      sec_todo: '⏳ To Do', sec_done: '✅ Done',
      chip_old: '⚠️ Over 1 day!',
      lbl_jobsheet: '📄 Jobsheet', lbl_awb: '🏷️ Airway Bill',
      btn_proof: '📸 Done! Take Proof Photo',
      proof_done: '✅ Done', posted: 'Posted', remaining: 'left',
      up_want: '🧵 Post New Jobsheet', up_delivery: '🚚 Post Delivery Instruction',
      up_postage: '📦 Post Airway Bill + Jobsheet', edit_title: '✏️ Edit Job',
      lbl_method: 'Delivery method',
      lbl_photo_job: 'Jobsheet Photo 📸', lbl_photo_awb: 'Airway Bill Photo (J&T) 📸',
      btn_takephoto: '📷 Take / Choose Photo', photo_ok: '✅ Photo OK — change?',
      photo_keep: '📷 Current photo — change?',
      lbl_note: 'Instruction (optional)', note_ph: 'Example: Deliver before 5pm',
      btn_cancel: 'Cancel', btn_post: '📤 Post', btn_save: '💾 Save',
      toast_posted: '📤 Posted!', toast_saved: '💾 Saved!',
      toast_deleted: '🗑️ Deleted.', toast_archived: '🗄️ Hidden.',
      toast_got: '❤️ Great! Sewing now.', toast_notseen: '❌ Office will follow up.',
      toast_done: '✅ Done! Thank you 🙏',
      toast_needphoto: 'Please take a photo first 📸',
      toast_needcat: 'Choose delivery method first 🛵🚌🤝',
      toast_need2: 'Need 2 photos: jobsheet + airway bill 📸',
      confirm_delete: 'Delete this job? Cannot undo!',
      ago_now: 'just now', ago_min: ' min ago', ago_hour: ' hr ago', ago_day: ' days ago'
    }
  };
  function t(k) { return STR[state.lang][k] || k; }

  // ------------------------------------------------------------ state
  var state = {
    tab: 'want',
    lang: localStorage.getItem('kilangLang') || '',
    deliveryCat: '',
    jobs: { want: [], delivery: [], postage: [] },
    upload: { photo1: null, photo2: null, cat: '' },
    editing: null,      // job object when editing, null when posting new
    proofJobId: null
  };
  var CAT_LABEL = { lalamove: '🛵 Lalamove', bus: '🚌 Bus', pickup: '🤝 Pickup' };
  var DAY = 24 * 60 * 60 * 1000;

  function imgUrl(id, w) {
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 1200);
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function timeAgo(ms) {
    if (!ms) return '';
    var d = Date.now() - ms;
    if (d < 60000) return t('ago_now');
    if (d < 3600000) return Math.floor(d / 60000) + t('ago_min');
    if (d < DAY) return Math.floor(d / 3600000) + t('ago_hour');
    return Math.floor(d / DAY) + t('ago_day');
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(el._h); el._h = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }
  function busy(on) { document.getElementById('spinner').style.display = on ? 'flex' : 'none'; }
  function viewPhoto(id) {
    document.getElementById('viewer-img').src = imgUrl(id, 1600);
    document.getElementById('viewer').classList.add('show');
  }
  function findJob(id) {
    var list = state.jobs[state.tab];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // ------------------------------------------------------------ language
  function setLang(l) {
    state.lang = l;
    localStorage.setItem('kilangLang', l);
    document.getElementById('lang-overlay').classList.remove('show');
    applyLang(); renderAll();
  }
  function closeLang() {
    // X or backdrop pressed: keep current language (BM default) — never trap the user
    setLang(state.lang);
  }
  function toggleLang() {
    setLang(state.lang === 'bm' ? 'en' : 'bm');
  }
  function applyLang() {
    document.getElementById('lang-toggle').textContent = state.lang === 'bm' ? '🌐 English' : '🌐 BM';
    document.getElementById('navlbl-want').textContent = t('nav_want');
    document.getElementById('navlbl-delivery').textContent = t('nav_delivery');
    document.getElementById('navlbl-postage').textContent = t('nav_postage');
    document.getElementById('pill-all').textContent = t('pill_all');
    document.getElementById('fab-txt').textContent = t('fab');
    document.getElementById('lbl-method').textContent = t('lbl_method');
    document.getElementById('photo2-label').textContent = t('lbl_photo_awb');
    document.getElementById('lbl-note').textContent = t('lbl_note');
    document.getElementById('upload-note').placeholder = t('note_ph');
    document.getElementById('btn-cancel').textContent = t('btn_cancel');
  }

  // ------------------------------------------------------------ tabs
  function switchTab(tab) {
    state.tab = tab;
    ['want', 'delivery', 'postage'].forEach(function (x) {
      document.getElementById('page-' + x).classList.toggle('active', x === tab);
      document.getElementById('nav-' + x).classList.toggle('active', x === tab);
    });
    refresh(tab);
  }

  function refresh(tab) {
    google.script.run
      .withSuccessHandler(function (jobs) { state.jobs[tab] = jobs; renderAll(); })
      .withFailureHandler(function (e) { toast('⚠️ ' + e.message); })
      .getJobs(tab);
    google.script.run.withSuccessHandler(renderBadges).getCounts();
  }
  function renderBadges(c) {
    ['want', 'delivery', 'postage'].forEach(function (x) {
      var b = document.getElementById('badge-' + x);
      b.style.display = c[x] > 0 ? 'block' : 'none';
      b.textContent = c[x];
    });
  }

  function renderAll() {
    renderWant(); renderDelivery(); renderPostage();
  }

  // small edit/delete/(archive) button row used on every card
  function toolBtns(j, withArchive) {
    var html = '<div class="tools">' +
      '<button class="t-edit" onclick="openUpload(\'' + j.id + '\')">' + t('btn_edit') + '</button>' +
      '<button class="t-del" onclick="removeJob(\'' + j.id + '\')">' + t('btn_delete') + '</button>';
    if (withArchive) {
      html += '<button class="t-arch" onclick="markJob(\'' + j.id + '\',\'archived\')">' + t('btn_archive') + '</button>';
    }
    return html + '</div>';
  }

  // ------------------------------------------------------------ TAB 1: want (swipe)
  function renderWant() {
    var jobs = state.jobs.want;
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var responded = jobs.filter(function (j) { return j.status === 'got' || j.status === 'notseen'; });
    var area = document.getElementById('want-stack-area');

    if (pending.length === 0) {
      area.innerHTML = '<div class="empty"><span class="big">🎉</span>' + t('empty_want') + '</div>';
    } else {
      var html = '<div class="stack-outer">';
      html += '<div class="swipe-help">' + t('swipe_help') + '</div>';
      html += '<div class="stack-wrap" id="stack">';
      var show = pending.slice(0, 3).reverse();   // last in DOM = top of stack
      for (var i = 0; i < show.length; i++) {
        var j = show[i];
        var top = (i === show.length - 1);
        html += '<div class="swipe-card" data-id="' + j.id + '" ' + (top ? 'id="topcard"' : '') + '>' +
          '<img src="' + imgUrl(j.photoIds[0]) + '" alt="jobsheet">' +
          '<div class="foot">' +
            '<div class="cap">📄 ' + (esc(j.note) || 'Jobsheet') + ' · ' + timeAgo(j.createdAt) +
            ' · ' + t('remaining') + ' ' + pending.length + '</div>' +
            toolBtns(j, false) +
          '</div>' +
          '<div class="stamp yes">❤️</div><div class="stamp no">❌</div>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="btn-row">' +
        '<button class="btn red" onclick="swipeAction(\'notseen\')">' + t('btn_notseen') + '</button>' +
        '<button class="btn green" onclick="swipeAction(\'got\')">' + t('btn_got') + '</button></div>';
      html += '</div>';
      area.innerHTML = html;
      attachSwipe();
    }

    var r = document.getElementById('want-responded');
    if (responded.length === 0) { r.innerHTML = ''; return; }
    var html2 = '<div class="section-title">' + t('sec_status') + '</div><div class="grid">';
    responded.forEach(function (j) {
      var got = j.status === 'got';
      html2 += '<div class="card"><div style="display:flex;flex:1">' +
        '<img src="' + imgUrl(j.photoIds[0], 300) + '" style="width:90px;object-fit:cover;cursor:pointer" onclick="viewPhoto(\'' + j.photoIds[0] + '\')">' +
        '<div class="body" style="flex:1">' +
        '<div class="note" style="font-size:15px">' + (got ? t('st_sewing') : t('st_notseen')) + '</div>' +
        '<div class="meta">' + timeAgo(j.doneAt) + '</div>' +
        (!got ? '<button class="btn green small" style="margin-top:8px" onclick="markJob(\'' + j.id + '\',\'got\')">' + t('btn_found') + '</button>' : '') +
        '<div class="spacer"></div>' +
        toolBtns(j, true) +
        '</div></div></div>';
    });
    r.innerHTML = html2 + '</div>';
  }

  function attachSwipe() {
    var card = document.getElementById('topcard');
    if (!card) return;
    var startX = 0, dx = 0, dragging = false;
    var yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');

    function move(x) {
      dx = x - startX;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
      yes.style.opacity = dx > 30 ? Math.min(1, dx / 110) : 0;
      no.style.opacity = dx < -30 ? Math.min(1, -dx / 110) : 0;
    }
    function end() {
      if (!dragging) return;
      dragging = false;
      if (dx > 110) flyOut(card, 1, 'got');
      else if (dx < -110) flyOut(card, -1, 'notseen');
      else { card.style.transition = 'transform .2s'; card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
             setTimeout(function () { card.style.transition = ''; }, 220); }
    }
    card.addEventListener('touchstart', function (e) {
      if (e.target.closest('button')) return;
      dragging = true; dx = 0; startX = e.touches[0].clientX;
    }, { passive: true });
    card.addEventListener('touchmove', function (e) { if (dragging) move(e.touches[0].clientX); }, { passive: true });
    card.addEventListener('touchend', end);
    card.addEventListener('mousedown', function (e) {
      if (e.target.closest('button')) return;
      dragging = true; dx = 0; startX = e.clientX; e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) { if (dragging) move(e.clientX); });
    window.addEventListener('mouseup', end);
  }

  function flyOut(card, dir, status) {
    var id = card.getAttribute('data-id');
    card.style.transition = 'transform .3s, opacity .3s';
    card.style.transform = 'translateX(' + (dir * window.innerWidth) + 'px) rotate(' + (dir * 30) + 'deg)';
    card.style.opacity = '0';
    setTimeout(function () { markJob(id, status); }, 250);
  }

  function swipeAction(status) {
    var card = document.getElementById('topcard');
    if (card) flyOut(card, status === 'got' ? 1 : -1, status);
  }

  // ------------------------------------------------------------ TAB 2: delivery
  document.getElementById('delivery-pills').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.deliveryCat = b.getAttribute('data-cat');
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    renderDelivery();
  });

  function renderDelivery() {
    var jobs = state.jobs.delivery.filter(function (j) {
      return !state.deliveryCat || j.category === state.deliveryCat;
    });
    document.getElementById('delivery-list').innerHTML = renderJobList(jobs, false);
  }

  // ------------------------------------------------------------ TAB 3: postage
  function renderPostage() {
    document.getElementById('postage-list').innerHTML = renderJobList(state.jobs.postage, true);
  }

  // shared card list for tabs 2 & 3
  function renderJobList(jobs, twoPhotos) {
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var done = jobs.filter(function (j) { return j.status === 'done'; });
    var html = '';

    if (pending.length === 0 && done.length === 0) {
      return '<div class="empty"><span class="big">📭</span>' + t('empty_list') + '</div>';
    }

    if (pending.length) {
      html += '<div class="section-title">' + t('sec_todo') + ' (' + pending.length + ')</div><div class="grid">';
      pending.forEach(function (j) { html += jobCard(j, twoPhotos, false); });
      html += '</div>';
    }
    if (done.length) {
      html += '<div class="section-title">' + t('sec_done') + ' (' + done.length + ')</div><div class="grid">';
      done.forEach(function (j) { html += jobCard(j, twoPhotos, true); });
      html += '</div>';
    }
    return html;
  }

  function jobCard(j, twoPhotos, isDone) {
    var old = !isDone && (Date.now() - j.createdAt > DAY);
    var html = '<div class="card">';

    if (twoPhotos && j.photoIds.length > 1) {
      html += '<div class="photo-pair">' +
        '<div><span class="lbl">' + t('lbl_jobsheet') + '</span><img src="' + imgUrl(j.photoIds[0], 600) + '" onclick="viewPhoto(\'' + j.photoIds[0] + '\')"></div>' +
        '<div><span class="lbl">' + t('lbl_awb') + '</span><img src="' + imgUrl(j.photoIds[1], 600) + '" onclick="viewPhoto(\'' + j.photoIds[1] + '\')"></div>' +
        '</div>';
    } else {
      html += '<img class="job" src="' + imgUrl(j.photoIds[0], 900) + '" onclick="viewPhoto(\'' + j.photoIds[0] + '\')">';
    }

    html += '<div class="body">';
    if (j.category) html += '<span class="chip ' + j.category + '">' + CAT_LABEL[j.category] + '</span> ';
    if (old) html += '<span class="chip old">' + t('chip_old') + '</span>';
    if (j.note) html += '<div class="note">📢 ' + esc(j.note) + '</div>';
    html += '<div class="meta">' + t('posted') + ' ' + timeAgo(j.createdAt) + '</div>';

    if (isDone) {
      html += '<div class="proof">' +
        (j.proofPhotoId ? '<img src="' + imgUrl(j.proofPhotoId, 300) + '" onclick="viewPhoto(\'' + j.proofPhotoId + '\')">' : '') +
        '<div class="txt">' + t('proof_done') + ' · ' + timeAgo(j.doneAt) + '</div></div>';
      html += '<div class="spacer"></div>' + toolBtns(j, true);
    } else {
      html += '<div class="spacer"></div>';
      html += '<button class="btn green" style="margin-top:10px" onclick="startProof(\'' + j.id + '\')">' + t('btn_proof') + '</button>';
      html += toolBtns(j, false);
    }
    html += '</div></div>';
    return html;
  }

  // ------------------------------------------------------------ status updates / delete
  function markJob(id, status) {
    busy(true);
    google.script.run
      .withSuccessHandler(function (jobs) {
        state.jobs[state.tab] = jobs; busy(false); renderAll();
        google.script.run.withSuccessHandler(renderBadges).getCounts();
        if (status === 'got') toast(t('toast_got'));
        if (status === 'notseen') toast(t('toast_notseen'));
        if (status === 'archived') toast(t('toast_archived'));
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); refresh(state.tab); })
      .updateStatus(id, status, null);
  }

  function removeJob(id) {
    if (!confirm(t('confirm_delete'))) return;
    busy(true);
    google.script.run
      .withSuccessHandler(function (jobs) {
        state.jobs[state.tab] = jobs; busy(false); renderAll();
        google.script.run.withSuccessHandler(renderBadges).getCounts();
        toast(t('toast_deleted'));
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); refresh(state.tab); })
      .deleteJob(id);
  }

  function startProof(jobId) {
    state.proofJobId = jobId;
    document.getElementById('proof-file').click();
  }
  function proofPicked(input) {
    if (!input.files || !input.files[0]) return;
    var id = state.proofJobId;
    busy(true);
    compressImage(input.files[0], function (b64) {
      google.script.run
        .withSuccessHandler(function (jobs) {
          state.jobs[state.tab] = jobs; busy(false); renderAll();
          google.script.run.withSuccessHandler(renderBadges).getCounts();
          toast(t('toast_done'));
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
        .updateStatus(id, 'done', b64);
    });
    input.value = '';
  }

  // ------------------------------------------------------------ upload & edit modal
  function openUpload(editId) {
    var job = editId ? findJob(editId) : null;
    state.editing = job;
    state.upload = { photo1: null, photo2: null, cat: job ? (job.category || '') : '' };

    var titles = { want: t('up_want'), delivery: t('up_delivery'), postage: t('up_postage') };
    document.getElementById('upload-title').textContent = job ? t('edit_title') : titles[state.tab];
    document.getElementById('upload-cat-wrap').style.display = state.tab === 'delivery' ? 'block' : 'none';
    document.getElementById('photo2-wrap').style.display = state.tab === 'postage' ? 'block' : 'none';
    document.getElementById('photo1-label').textContent = t('lbl_photo_job');
    document.getElementById('btn-submit').textContent = job ? t('btn_save') : t('btn_post');
    document.getElementById('upload-note').value = job ? (job.note || '') : '';

    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', !!job && b.getAttribute('data-cat') === job.category);
    });

    setPhotoBtn(1, job && job.photoIds[0] ? imgUrl(job.photoIds[0], 300) : null);
    setPhotoBtn(2, job && job.photoIds[1] ? imgUrl(job.photoIds[1], 300) : null);

    document.getElementById('upload-overlay').classList.add('show');
  }
  function closeUpload() { document.getElementById('upload-overlay').classList.remove('show'); }

  function pickCat(btn) {
    state.upload.cat = btn.getAttribute('data-cat');
    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }

  /** existingUrl: show current photo (edit mode); null: empty "take photo" state */
  function setPhotoBtn(n, existingUrl) {
    var b = document.getElementById('photo' + n + '-btn');
    if (existingUrl) {
      b.classList.add('hasphoto');
      b.innerHTML = '<img src="' + existingUrl + '"> ' + t('photo_keep');
    } else {
      b.classList.remove('hasphoto');
      b.innerHTML = t('btn_takephoto');
    }
  }
  function photoPicked(input, n) {
    if (!input.files || !input.files[0]) return;
    busy(true);
    compressImage(input.files[0], function (b64) {
      busy(false);
      state.upload['photo' + n] = b64;
      var b = document.getElementById('photo' + n + '-btn');
      b.classList.add('hasphoto');
      b.innerHTML = '<img src="data:image/jpeg;base64,' + b64 + '"> ' + t('photo_ok');
    });
    input.value = '';
  }

  function submitUpload() {
    var note = document.getElementById('upload-note').value.trim();

    if (state.editing) {
      if (state.tab === 'delivery' && !state.upload.cat) { toast(t('toast_needcat')); return; }
      busy(true);
      google.script.run
        .withSuccessHandler(function (jobs) {
          state.jobs[state.tab] = jobs; busy(false); closeUpload(); renderAll();
          toast(t('toast_saved'));
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
        .editJob(state.editing.id, {
          note: note,
          category: state.tab === 'delivery' ? state.upload.cat : (state.editing.category || ''),
          photo1: state.upload.photo1,
          photo2: state.upload.photo2
        });
      return;
    }

    if (!state.upload.photo1) { toast(t('toast_needphoto')); return; }
    if (state.tab === 'delivery' && !state.upload.cat) { toast(t('toast_needcat')); return; }
    if (state.tab === 'postage' && !state.upload.photo2) { toast(t('toast_need2')); return; }
    var photos = [state.upload.photo1];
    if (state.upload.photo2) photos.push(state.upload.photo2);
    busy(true);
    google.script.run
      .withSuccessHandler(function (jobs) {
        state.jobs[state.tab] = jobs; busy(false); closeUpload(); renderAll();
        google.script.run.withSuccessHandler(renderBadges).getCounts();
        toast(t('toast_posted'));
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
      .addJob({
        tab: state.tab,
        category: state.upload.cat,
        note: note,
        photos: photos
      });
  }

  // close any modal by clicking/tapping the dark backdrop
  ['upload-overlay', 'lang-overlay'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      if (e.target !== this) return;
      if (id === 'lang-overlay') closeLang(); else closeUpload();
    });
  });

  // ------------------------------------------------------------ image compression
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX = 1280;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.8);
        cb(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ------------------------------------------------------------ boot
  var storedLang = localStorage.getItem('kilangLang');
  state.lang = (storedLang === 'en' || storedLang === 'bm') ? storedLang : 'bm';
  applyLang();
  if (!storedLang) document.getElementById('lang-overlay').classList.add('show');
  switchTab('want');
  setInterval(function () {
    // silent background refresh every 60s
    if (!document.getElementById('upload-overlay').classList.contains('show')) refresh(state.tab);
  }, 60000);
</script>
