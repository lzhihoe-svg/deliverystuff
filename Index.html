<style>
  :root {
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --orange: #ea580c;
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    padding-bottom: 84px; /* room for bottom nav */
    overscroll-behavior-y: contain;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: #0f172a; color: #fff;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; }
  header .who { font-size: 13px; opacity: .85; }
  header .who b { color: #fbbf24; }

  /* ---------- bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: #fff; border-top: 1px solid #e2e8f0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; padding: 8px 0 10px;
    font-size: 12px; color: var(--muted); position: relative; cursor: pointer;
  }
  nav button .ico { display: block; font-size: 26px; line-height: 1.2; }
  nav button.active { color: var(--blue); font-weight: 700; }
  nav button .badge {
    position: absolute; top: 2px; right: 22%;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    line-height: 18px; padding: 0 4px; display: none;
  }

  /* ---------- generic ---------- */
  .page { display: none; padding: 14px; max-width: 560px; margin: 0 auto; }
  .page.active { display: block; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 16px; }
  .empty .big { font-size: 52px; display: block; margin-bottom: 10px; }

  .card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(15,23,42,.08); margin-bottom: 14px;
  }
  .card img.job { width: 100%; display: block; background: #e2e8f0; min-height: 120px; object-fit: contain; }
  .card .body { padding: 12px 14px; }
  .card .note { font-size: 16px; margin-bottom: 8px; white-space: pre-wrap; }
  .card .meta { font-size: 12px; color: var(--muted); }

  .chip {
    display: inline-block; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 12px; margin-bottom: 8px;
  }
  .chip.lalamove { background: #ffedd5; color: #9a3412; }
  .chip.bus      { background: #dbeafe; color: #1e40af; }
  .chip.pickup   { background: #dcfce7; color: #166534; }
  .chip.old      { background: #fee2e2; color: #991b1b; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px;
    padding: 16px; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
  }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn.blue { background: var(--blue); }
  .btn.gray { background: #94a3b8; }
  .btn.small { padding: 10px; font-size: 15px; border-radius: 10px; }
  .btn:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  /* ---------- swipe stack (tab 1) ---------- */
  .stack-wrap { position: relative; height: 62vh; max-height: 520px; margin-bottom: 12px; }
  .swipe-card {
    position: absolute; inset: 0; background: #fff; border-radius: 18px;
    box-shadow: 0 4px 16px rgba(15,23,42,.15); overflow: hidden;
    display: flex; flex-direction: column; touch-action: none; user-select: none;
  }
  .swipe-card img { flex: 1; width: 100%; object-fit: contain; background: #0f172a; pointer-events: none; }
  .swipe-card .foot { padding: 10px 14px; font-size: 13px; color: var(--muted); background: #fff; }
  .stamp {
    position: absolute; top: 24px; font-size: 40px; font-weight: 900;
    padding: 6px 18px; border: 5px solid; border-radius: 12px; opacity: 0;
    transform: rotate(-12deg); pointer-events: none;
  }
  .stamp.yes { left: 16px; color: var(--green); border-color: var(--green); }
  .stamp.no  { right: 16px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .swipe-help { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }

  /* ---------- category pills (tab 2) ---------- */
  .pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .pills button {
    border: 2px solid #cbd5e1; background: #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; color: var(--muted);
    white-space: nowrap; cursor: pointer;
  }
  .pills button.active { border-color: var(--blue); background: var(--blue); color: #fff; }

  /* ---------- two-photo layout (tab 3) ---------- */
  .photo-pair { display: flex; gap: 2px; background: #e2e8f0; }
  .photo-pair > div { flex: 1; position: relative; }
  .photo-pair img { width: 100%; display: block; min-height: 120px; object-fit: contain; background: #e2e8f0; }
  .photo-pair .lbl {
    position: absolute; top: 6px; left: 6px; background: rgba(15,23,42,.75);
    color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }

  .proof { display: flex; align-items: center; gap: 10px; background: #f0fdf4; border-radius: 10px; padding: 8px; margin-top: 10px; }
  .proof img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
  .proof .txt { font-size: 13px; color: #166534; font-weight: 600; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 16px; bottom: 88px; z-index: 25;
    width: 62px; height: 62px; border-radius: 50%; border: 0;
    background: var(--blue); color: #fff; font-size: 34px; line-height: 62px;
    box-shadow: 0 4px 14px rgba(37,99,235,.5); cursor: pointer; display: none;
  }

  /* ---------- modals ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 20px 16px 30px; max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 19px; margin-bottom: 14px; }
  .sheet label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .sheet textarea, .sheet input[type=text] {
    width: 100%; border: 2px solid #cbd5e1; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit;
  }
  .photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 2px dashed #94a3b8; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; color: var(--muted);
    background: #f8fafc; cursor: pointer;
  }
  .photo-btn.hasphoto { border-style: solid; border-color: var(--green); color: var(--green); background: #f0fdf4; }
  .photo-btn img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  input[type=file] { display: none; }

  .rolepick { display: flex; gap: 10px; }
  .rolepick button {
    flex: 1; border: 2px solid #cbd5e1; background: #fff; border-radius: 14px;
    padding: 16px 8px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .rolepick button.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }
  .rolepick .big { display: block; font-size: 34px; margin-bottom: 4px; }

  /* ---------- toast & spinner ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; z-index: 90; display: none; max-width: 90%;
  }
  #spinner {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; background: rgba(255,255,255,.6);
  }
  #spinner .ring {
    width: 54px; height: 54px; border-radius: 50%;
    border: 6px solid #cbd5e1; border-top-color: var(--blue);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70; display: none; align-items: center; justify-content: center; }
  .viewer.show { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; }
</style>

<header>
  <h1>🏭 Kilang App</h1>
  <div class="who" id="whoami" onclick="openNameModal()"></div>
</header>

<!-- ================= TAB 1 : KILANG WANT ================= -->
<div class="page" id="page-want">
  <div id="want-stack-area"></div>
  <div id="want-responded"></div>
</div>

<!-- ================= TAB 2 : DELIVERY ================= -->
<div class="page" id="page-delivery">
  <div class="pills" id="delivery-pills">
    <button data-cat="" class="active">Semua / All</button>
    <button data-cat="lalamove">🛵 Lalamove</button>
    <button data-cat="bus">🚌 Bus</button>
    <button data-cat="pickup">🤝 Pickup</button>
  </div>
  <div id="delivery-list"></div>
</div>

<!-- ================= TAB 3 : POSTAGE ================= -->
<div class="page" id="page-postage">
  <div id="postage-list"></div>
</div>

<!-- ================= BOTTOM NAV ================= -->
<nav>
  <button id="nav-want" onclick="switchTab('want')">
    <span class="ico">🧵</span>Jahit<span class="badge" id="badge-want"></span>
  </button>
  <button id="nav-delivery" onclick="switchTab('delivery')">
    <span class="ico">🚚</span>Hantar<span class="badge" id="badge-delivery"></span>
  </button>
  <button id="nav-postage" onclick="switchTab('postage')">
    <span class="ico">📦</span>Pos<span class="badge" id="badge-postage"></span>
  </button>
</nav>

<button class="fab" id="fab" onclick="openUpload()">＋</button>

<!-- ================= NAME / ROLE MODAL ================= -->
<div class="overlay" id="name-overlay">
  <div class="sheet">
    <h2>👋 Siapa anda? / Who are you?</h2>
    <label>Nama / Name</label>
    <input type="text" id="name-input" placeholder="Contoh: Amin" maxlength="30">
    <label>Peranan / Role</label>
    <div class="rolepick">
      <button id="role-boss" onclick="pickRole('boss')"><span class="big">👔</span>Boss</button>
      <button id="role-staff" onclick="pickRole('staff')"><span class="big">🧵</span>Staff Kilang</button>
    </div>
    <div style="margin-top:20px">
      <button class="btn blue" onclick="saveName()">✅ Mula / Start</button>
    </div>
  </div>
</div>

<!-- ================= UPLOAD MODAL (boss) ================= -->
<div class="overlay" id="upload-overlay">
  <div class="sheet">
    <h2 id="upload-title"></h2>

    <div id="upload-cat-wrap" style="display:none">
      <label>Cara hantar / Delivery method</label>
      <div class="rolepick" id="upload-cats">
        <button data-cat="lalamove" onclick="pickCat(this)"><span class="big">🛵</span>Lalamove</button>
        <button data-cat="bus" onclick="pickCat(this)"><span class="big">🚌</span>Bus</button>
        <button data-cat="pickup" onclick="pickCat(this)"><span class="big">🤝</span>Pickup</button>
      </div>
    </div>

    <label id="photo1-label">Gambar Jobsheet 📸</label>
    <button class="photo-btn" id="photo1-btn" onclick="document.getElementById('photo1-file').click()">📷 Ambil / Pilih Gambar</button>
    <input type="file" id="photo1-file" accept="image/*" onchange="photoPicked(this, 1)">

    <div id="photo2-wrap" style="display:none">
      <label>Gambar Airway Bill (J&amp;T) 📸</label>
      <button class="photo-btn" id="photo2-btn" onclick="document.getElementById('photo2-file').click()">📷 Ambil / Pilih Gambar</button>
      <input type="file" id="photo2-file" accept="image/*" onchange="photoPicked(this, 2)">
    </div>

    <label>Arahan / Instruction (optional)</label>
    <textarea id="upload-note" rows="2" placeholder="Contoh: Hantar sebelum 5pm"></textarea>

    <div class="btn-row">
      <button class="btn gray" onclick="closeUpload()">Batal</button>
      <button class="btn blue" onclick="submitUpload()">📤 Hantar / Post</button>
    </div>
  </div>
</div>

<!-- ================= PROOF PHOTO (staff confirm) ================= -->
<input type="file" id="proof-file" accept="image/*" capture="environment" onchange="proofPicked(this)">

<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewer-img"></div>
<div id="toast"></div>
<div id="spinner"><div class="ring"></div></div>

<script>
  // ------------------------------------------------------------ state
  var state = {
    tab: 'want',
    name: localStorage.getItem('kilangName') || '',
    role: localStorage.getItem('kilangRole') || '',
    deliveryCat: '',
    jobs: { want: [], delivery: [], postage: [] },
    upload: { photo1: null, photo2: null, cat: '' },
    proofJobId: null,
    pickedRole: ''
  };
  var CAT_LABEL = { lalamove: '🛵 Lalamove', bus: '🚌 Bus', pickup: '🤝 Pickup' };
  var DAY = 24 * 60 * 60 * 1000;

  function imgUrl(id, w) {
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 1200);
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function timeAgo(ms) {
    if (!ms) return '';
    var d = Date.now() - ms;
    if (d < 60000) return 'baru sahaja';
    if (d < 3600000) return Math.floor(d / 60000) + ' min lalu';
    if (d < DAY) return Math.floor(d / 3600000) + ' jam lalu';
    return Math.floor(d / DAY) + ' hari lalu';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function busy(on) { document.getElementById('spinner').style.display = on ? 'flex' : 'none'; }
  function isBoss() { return state.role === 'boss'; }
  function viewPhoto(id) {
    document.getElementById('viewer-img').src = imgUrl(id, 1600);
    document.getElementById('viewer').classList.add('show');
  }

  // ------------------------------------------------------------ name / role
  function openNameModal() {
    document.getElementById('name-input').value = state.name;
    state.pickedRole = state.role;
    document.getElementById('role-boss').classList.toggle('active', state.role === 'boss');
    document.getElementById('role-staff').classList.toggle('active', state.role === 'staff');
    document.getElementById('name-overlay').classList.add('show');
  }
  function pickRole(r) {
    state.pickedRole = r;
    document.getElementById('role-boss').classList.toggle('active', r === 'boss');
    document.getElementById('role-staff').classList.toggle('active', r === 'staff');
  }
  function saveName() {
    var n = document.getElementById('name-input').value.trim();
    if (!n) { toast('Sila isi nama / Please enter your name'); return; }
    if (!state.pickedRole) { toast('Sila pilih peranan / Please pick a role'); return; }
    state.name = n; state.role = state.pickedRole;
    localStorage.setItem('kilangName', n);
    localStorage.setItem('kilangRole', state.role);
    document.getElementById('name-overlay').classList.remove('show');
    renderHeader(); renderAll();
  }
  function renderHeader() {
    document.getElementById('whoami').innerHTML =
      (isBoss() ? '👔 ' : '🧵 ') + '<b>' + esc(state.name) + '</b> ✏️';
    document.getElementById('fab').style.display = isBoss() ? 'block' : 'none';
  }

  // ------------------------------------------------------------ tabs
  function switchTab(tab) {
    state.tab = tab;
    ['want', 'delivery', 'postage'].forEach(function (t) {
      document.getElementById('page-' + t).classList.toggle('active', t === tab);
      document.getElementById('nav-' + t).classList.toggle('active', t === tab);
    });
    refresh(tab);
  }

  function refresh(tab) {
    google.script.run
      .withSuccessHandler(function (jobs) { state.jobs[tab] = jobs; renderAll(); })
      .withFailureHandler(function (e) { toast('⚠️ ' + e.message); })
      .getJobs(tab);
    google.script.run.withSuccessHandler(renderBadges).getCounts();
  }
  function renderBadges(c) {
    ['want', 'delivery', 'postage'].forEach(function (t) {
      var b = document.getElementById('badge-' + t);
      b.style.display = c[t] > 0 ? 'block' : 'none';
      b.textContent = c[t];
    });
  }

  function renderAll() {
    renderWant(); renderDelivery(); renderPostage();
  }

  // ------------------------------------------------------------ TAB 1: want (swipe)
  function renderWant() {
    var jobs = state.jobs.want;
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var responded = jobs.filter(function (j) { return j.status === 'got' || j.status === 'notseen'; });
    var area = document.getElementById('want-stack-area');

    if (pending.length === 0) {
      area.innerHTML = '<div class="empty"><span class="big">🎉</span>' +
        'Tiada jobsheet baru!<br>No new jobsheets.</div>';
    } else {
      var html = '<div class="swipe-help">👈 ❌ Belum nampak &nbsp;|&nbsp; ❤️ Dah ambil, tengah jahit 👉</div>';
      html += '<div class="stack-wrap" id="stack">';
      // render up to 3, last in DOM = top of stack
      var show = pending.slice(0, 3).reverse();
      for (var i = 0; i < show.length; i++) {
        var j = show[i];
        var top = (i === show.length - 1);
        html += '<div class="swipe-card" data-id="' + j.id + '" ' + (top ? 'id="topcard"' : '') + '>' +
          '<img src="' + imgUrl(j.photoIds[0]) + '" alt="jobsheet">' +
          '<div class="foot">📄 ' + (esc(j.note) || 'Jobsheet') + ' · ' + timeAgo(j.createdAt) +
          ' · baki ' + pending.length + '</div>' +
          '<div class="stamp yes">❤️ ADA</div><div class="stamp no">❌ TIADA</div>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="btn-row">' +
        '<button class="btn red" onclick="swipeAction(\'notseen\')">❌ Belum Nampak</button>' +
        '<button class="btn green" onclick="swipeAction(\'got\')">❤️ Dah Ambil</button></div>';
      area.innerHTML = html;
      attachSwipe();
    }

    var r = document.getElementById('want-responded');
    if (responded.length === 0) { r.innerHTML = ''; return; }
    var html2 = '<div class="section-title">📋 Status Jobsheet</div>';
    responded.forEach(function (j) {
      var got = j.status === 'got';
      html2 += '<div class="card"><div style="display:flex">' +
        '<img src="' + imgUrl(j.photoIds[0], 300) + '" style="width:90px;height:90px;object-fit:cover" onclick="viewPhoto(\'' + j.photoIds[0] + '\')">' +
        '<div class="body" style="flex:1">' +
        '<div class="note" style="font-size:15px">' + (got ? '❤️ Tengah jahit' : '❌ Belum nampak') + '</div>' +
        '<div class="meta">' + esc(j.doneBy) + ' · ' + timeAgo(j.doneAt) + '</div>' +
        (!got ? '<button class="btn green small" style="margin-top:8px" onclick="markJob(\'' + j.id + '\',\'got\')">❤️ Dah jumpa, tengah jahit</button>' : '') +
        (isBoss() ? '<button class="btn gray small" style="margin-top:8px" onclick="markJob(\'' + j.id + '\',\'archived\')">🗄️ Arkib / Hide</button>' : '') +
        '</div></div></div>';
    });
    r.innerHTML = html2;
  }

  function attachSwipe() {
    var card = document.getElementById('topcard');
    if (!card) return;
    var startX = 0, dx = 0, dragging = false;
    var yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');

    function move(x) {
      dx = x - startX;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
      yes.style.opacity = dx > 30 ? Math.min(1, dx / 110) : 0;
      no.style.opacity = dx < -30 ? Math.min(1, -dx / 110) : 0;
    }
    function end() {
      if (!dragging) return;
      dragging = false;
      if (dx > 110) flyOut(card, 1, 'got');
      else if (dx < -110) flyOut(card, -1, 'notseen');
      else { card.style.transition = 'transform .2s'; card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
             setTimeout(function () { card.style.transition = ''; }, 220); }
    }
    card.addEventListener('touchstart', function (e) { dragging = true; startX = e.touches[0].clientX; }, { passive: true });
    card.addEventListener('touchmove', function (e) { if (dragging) move(e.touches[0].clientX); }, { passive: true });
    card.addEventListener('touchend', end);
    card.addEventListener('mousedown', function (e) { dragging = true; startX = e.clientX; e.preventDefault(); });
    window.addEventListener('mousemove', function (e) { if (dragging) move(e.clientX); });
    window.addEventListener('mouseup', end);
  }

  function flyOut(card, dir, status) {
    var id = card.getAttribute('data-id');
    card.style.transition = 'transform .3s, opacity .3s';
    card.style.transform = 'translateX(' + (dir * window.innerWidth) + 'px) rotate(' + (dir * 30) + 'deg)';
    card.style.opacity = '0';
    setTimeout(function () { markJob(id, status); }, 250);
  }

  function swipeAction(status) {
    var card = document.getElementById('topcard');
    if (card) flyOut(card, status === 'got' ? 1 : -1, status);
  }

  // ------------------------------------------------------------ TAB 2: delivery
  document.getElementById('delivery-pills').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.deliveryCat = b.getAttribute('data-cat');
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    renderDelivery();
  });

  function renderDelivery() {
    var jobs = state.jobs.delivery.filter(function (j) {
      return !state.deliveryCat || j.category === state.deliveryCat;
    });
    document.getElementById('delivery-list').innerHTML = renderJobList(jobs, false);
  }

  // ------------------------------------------------------------ TAB 3: postage
  function renderPostage() {
    document.getElementById('postage-list').innerHTML = renderJobList(state.jobs.postage, true);
  }

  // shared card list for tabs 2 & 3
  function renderJobList(jobs, twoPhotos) {
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var done = jobs.filter(function (j) { return j.status === 'done'; });
    var html = '';

    if (pending.length === 0 && done.length === 0) {
      return '<div class="empty"><span class="big">📭</span>Tiada kerja lagi.<br>Nothing here yet.</div>';
    }

    if (pending.length) html += '<div class="section-title">⏳ Belum Siap / To Do (' + pending.length + ')</div>';
    pending.forEach(function (j) { html += jobCard(j, twoPhotos, false); });

    if (done.length) html += '<div class="section-title">✅ Siap / Done (' + done.length + ')</div>';
    done.forEach(function (j) { html += jobCard(j, twoPhotos, true); });
    return html;
  }

  function jobCard(j, twoPhotos, isDone) {
    var old = !isDone && (Date.now() - j.createdAt > DAY);
    var html = '<div class="card">';

    if (twoPhotos && j.photoIds.length > 1) {
      html += '<div class="photo-pair">' +
        '<div><span class="lbl">📄 Jobsheet</span><img src="' + imgUrl(j.photoIds[0], 600) + '" onclick="viewPhoto(\'' + j.photoIds[0] + '\')"></div>' +
        '<div><span class="lbl">🏷️ Airway Bill</span><img src="' + imgUrl(j.photoIds[1], 600) + '" onclick="viewPhoto(\'' + j.photoIds[1] + '\')"></div>' +
        '</div>';
    } else {
      html += '<img class="job" src="' + imgUrl(j.photoIds[0], 900) + '" onclick="viewPhoto(\'' + j.photoIds[0] + '\')">';
    }

    html += '<div class="body">';
    if (j.category) html += '<span class="chip ' + j.category + '">' + CAT_LABEL[j.category] + '</span> ';
    if (old) html += '<span class="chip old">⚠️ Lebih 1 hari!</span>';
    if (j.note) html += '<div class="note">📢 ' + esc(j.note) + '</div>';
    html += '<div class="meta">Oleh ' + esc(j.createdBy) + ' · ' + timeAgo(j.createdAt) + '</div>';

    if (isDone) {
      html += '<div class="proof">' +
        (j.proofPhotoId ? '<img src="' + imgUrl(j.proofPhotoId, 300) + '" onclick="viewPhoto(\'' + j.proofPhotoId + '\')">' : '') +
        '<div class="txt">✅ Siap oleh ' + esc(j.doneBy) + '<br>' + timeAgo(j.doneAt) + '</div></div>';
      if (isBoss()) {
        html += '<button class="btn gray small" style="margin-top:10px" onclick="markJob(\'' + j.id + '\',\'archived\')">🗄️ Arkib / Hide</button>';
      }
    } else {
      html += '<button class="btn green" style="margin-top:10px" onclick="startProof(\'' + j.id + '\')">📸 Siap! Ambil Gambar Bukti</button>';
    }
    html += '</div></div>';
    return html;
  }

  // ------------------------------------------------------------ status updates
  function markJob(id, status) {
    busy(true);
    google.script.run
      .withSuccessHandler(function (jobs) {
        state.jobs[state.tab] = jobs; busy(false); renderAll();
        google.script.run.withSuccessHandler(renderBadges).getCounts();
        if (status === 'got') toast('❤️ Bagus! Tengah jahit.');
        if (status === 'notseen') toast('❌ Boss akan follow-up.');
        if (status === 'archived') toast('🗄️ Disimpan dalam arkib.');
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); refresh(state.tab); })
      .updateStatus(id, status, state.name, null);
  }

  function startProof(jobId) {
    state.proofJobId = jobId;
    document.getElementById('proof-file').click();
  }
  function proofPicked(input) {
    if (!input.files || !input.files[0]) return;
    var id = state.proofJobId;
    busy(true);
    compressImage(input.files[0], function (b64) {
      google.script.run
        .withSuccessHandler(function (jobs) {
          state.jobs[state.tab] = jobs; busy(false); renderAll();
          google.script.run.withSuccessHandler(renderBadges).getCounts();
          toast('✅ Siap! Terima kasih ' + state.name + ' 🙏');
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
        .updateStatus(id, 'done', state.name, b64);
    });
    input.value = '';
  }

  // ------------------------------------------------------------ upload (boss)
  function openUpload() {
    state.upload = { photo1: null, photo2: null, cat: '' };
    var titles = {
      want: '🧵 Post Jobsheet Baru',
      delivery: '🚚 Post Arahan Penghantaran',
      postage: '📦 Post Airway Bill + Jobsheet'
    };
    document.getElementById('upload-title').textContent = titles[state.tab];
    document.getElementById('upload-cat-wrap').style.display = state.tab === 'delivery' ? 'block' : 'none';
    document.getElementById('photo2-wrap').style.display = state.tab === 'postage' ? 'block' : 'none';
    document.getElementById('photo1-label').textContent =
      state.tab === 'postage' ? 'Gambar Jobsheet 📸' : 'Gambar Jobsheet 📸';
    resetPhotoBtn(1); resetPhotoBtn(2);
    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    document.getElementById('upload-note').value = '';
    document.getElementById('upload-overlay').classList.add('show');
  }
  function closeUpload() { document.getElementById('upload-overlay').classList.remove('show'); }
  function pickCat(btn) {
    state.upload.cat = btn.getAttribute('data-cat');
    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }
  function resetPhotoBtn(n) {
    var b = document.getElementById('photo' + n + '-btn');
    b.classList.remove('hasphoto');
    b.innerHTML = '📷 Ambil / Pilih Gambar';
  }
  function photoPicked(input, n) {
    if (!input.files || !input.files[0]) return;
    busy(true);
    compressImage(input.files[0], function (b64) {
      busy(false);
      state.upload['photo' + n] = b64;
      var b = document.getElementById('photo' + n + '-btn');
      b.classList.add('hasphoto');
      b.innerHTML = '<img src="data:image/jpeg;base64,' + b64 + '"> ✅ Gambar OK — tukar?';
    });
    input.value = '';
  }
  function submitUpload() {
    if (!state.upload.photo1) { toast('Sila ambil gambar dulu 📸'); return; }
    if (state.tab === 'delivery' && !state.upload.cat) { toast('Pilih cara hantar dulu 🛵🚌🤝'); return; }
    if (state.tab === 'postage' && !state.upload.photo2) { toast('Perlu 2 gambar: jobsheet + airway bill 📸'); return; }
    var photos = [state.upload.photo1];
    if (state.upload.photo2) photos.push(state.upload.photo2);
    busy(true);
    google.script.run
      .withSuccessHandler(function (jobs) {
        state.jobs[state.tab] = jobs; busy(false); closeUpload(); renderAll();
        google.script.run.withSuccessHandler(renderBadges).getCounts();
        toast('📤 Sudah post!');
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
      .addJob({
        tab: state.tab,
        category: state.upload.cat,
        note: document.getElementById('upload-note').value.trim(),
        photos: photos,
        createdBy: state.name
      });
  }

  // ------------------------------------------------------------ image compression
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX = 1280;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.8);
        cb(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ------------------------------------------------------------ boot
  renderHeader();
  if (!state.name || !state.role) openNameModal();
  switchTab('want');
  setInterval(function () {
    // silent background refresh every 60s
    if (!document.getElementById('upload-overlay').classList.contains('show')) refresh(state.tab);
  }, 60000);
</script>
