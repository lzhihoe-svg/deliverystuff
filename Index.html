<script>
  // ------------------------------------------------------------ state
  var state = {
    tab: 'want',
    role: localStorage.getItem('kilangRole') || '',
    pin: localStorage.getItem('kilangPin') || '',
    deliveryCat: '',
    jobs: { want: [], delivery: [], postage: [] },
    upload: { photos: [], js: [], wb: [], cat: '' },   // entries: {b64,thumb} new, {id,thumbId} existing
    editing: null,
    proofJobId: null,
    reProof: false,
    lastSwipe: null
  };
  var CAT_LABEL = { lalamove: '🛵 Lalamove', bus: '🚌 Bus', pickup: '🤝 Pickup' };
  var DAY = 24 * 60 * 60 * 1000;
  var MAX_PHOTOS = 6;

  function isAdmin() { return state.role === 'admin'; }

  // thumbnail id for photo i of a job (falls back to full image for old jobs)
  function thumbOf(j, i) {
    return (j.thumbIds && j.thumbIds[i]) ? j.thumbIds[i] : j.photoIds[i];
  }
  function proofThumbOf(j) { return j.proofThumbId || j.proofPhotoId; }

  // ------------------------------------------------------------ images
  // Photos are served THROUGH the app (base64 via getImagesData) and cached
  // on the device (localStorage) so they never re-download on later visits.
  var imgCache = {};
  var imgFetching = {};
  var activeLoads = 0;
  var MAX_PARALLEL = 4, BATCH = 4;

  // Interactive work (PIN check, saves) and photo uploads get the network to
  // themselves: background image downloads pause while they run. This is what
  // used to make "Checking PIN…" hang for 30s behind image traffic.
  var priorityHold = 0;
  var uploadsPending = 0;   // photos still uploading in the background
  function holdImages() { return priorityHold > 0 || uploadsPending > 0; }

  // Lazy loading: only photos on (or near) the screen are downloaded.
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
    var any = false;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].isIntersecting) { entries[i].target.setAttribute('data-vis', '1'); any = true; }
    }
    if (any) loadImages();
  }, { root: document.getElementById('scroller'), rootMargin: '600px' }) : null;

  function observeImages() {
    if (!io) return;
    io.disconnect();
    var els = document.querySelectorAll('img[data-img]');
    for (var i = 0; i < els.length; i++) {
      if (!cachedImg(els[i].getAttribute('data-img'))) io.observe(els[i]);
    }
  }
  var PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">' +
    '<rect width="400" height="300" fill="#ecfccb"/>' +
    '<text x="200" y="162" font-size="46" text-anchor="middle">📷</text>' +
    '<text x="200" y="210" font-size="18" fill="#4d7c0f" text-anchor="middle" font-family="sans-serif" font-weight="bold">Loading…</text></svg>');

  function cachedImg(id) {
    if (imgCache[id]) return imgCache[id];
    var v = null;
    try { v = localStorage.getItem('ki_' + id); } catch (e) {}
    if (v) imgCache[id] = v;
    return v;
  }
  function persistImg(id, data) {
    if (!data || data.length > 90000) return; // persist small images (thumbs) only
    if (String(id).indexOf('local') === 0) return; // temp upload previews stay in memory
    try { localStorage.setItem('ki_' + id, data); }
    catch (e) {
      // storage full: clear old cached images and retry once
      try {
        var kill = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('ki_') === 0) kill.push(k);
        }
        kill.forEach(function (k) { localStorage.removeItem(k); });
        localStorage.setItem('ki_' + id, data);
      } catch (e2) {}
    }
  }

  function imgTag(id, style, extra) {
    return '<img data-img="' + id + '" src="' + (cachedImg(id) || PLACEHOLDER) + '" ' +
      (style ? 'style="' + style + '" ' : '') + (extra || '') + '>';
  }

  function applyLoaded() {
    var els = document.querySelectorAll('img[data-img]');
    for (var i = 0; i < els.length; i++) {
      var id = els[i].getAttribute('data-img');
      if (imgCache[id] && els[i].getAttribute('src') !== imgCache[id]) els[i].src = imgCache[id];
    }
  }

  // Extra ids to download soon (e.g. the next/previous photo while the
  // fullscreen viewer is open) so swiping to them is instant.
  var prefetchWant = {};
  function prefetchImg(id) {
    if (id && !cachedImg(id) && String(id).indexOf('local') !== 0) prefetchWant[id] = 1;
  }

  function loadImages() {
    if (holdImages()) return;               // pause behind PIN checks / uploads
    if (activeLoads >= MAX_PARALLEL) return;
    var want = [];
    var els = document.querySelectorAll('img[data-img]');
    for (var i = 0; i < els.length; i++) {
      if (io && !els[i].getAttribute('data-vis')) continue;  // offscreen: skip
      var id = els[i].getAttribute('data-img');
      if (String(id).indexOf('local') === 0) continue;       // temp preview, already local
      if (!cachedImg(id) && !imgFetching[id] && want.indexOf(id) < 0) want.push(id);
    }
    for (var p in prefetchWant) {
      if (cachedImg(p)) { delete prefetchWant[p]; continue; }
      if (!imgFetching[p] && want.indexOf(p) < 0) want.push(p);
    }
    while (want.length && activeLoads < MAX_PARALLEL) {
      var batch = want.splice(0, BATCH);
      fireBatch_(batch);
    }
  }
  function fireBatch_(batch) {
    activeLoads++;
    batch.forEach(function (id) { imgFetching[id] = true; });
    google.script.run
      .withSuccessHandler(function (map) {
        activeLoads--;
        for (var k in map) {
          if (map[k]) { imgCache[k] = map[k]; persistImg(k, map[k]); }
        }
        batch.forEach(function (id) { delete imgFetching[id]; });
        applyLoaded();
        syncPhotosTick();
        loadImages();
      })
      .withFailureHandler(function () {
        activeLoads--;
        batch.forEach(function (id) { delete imgFetching[id]; });
      })
      .getImagesData(batch);
  }

  function seedImage(id, base64jpeg) {
    if (id && base64jpeg) {
      imgCache[id] = 'data:image/jpeg;base64,' + base64jpeg;
      persistImg(id, imgCache[id]);
    }
  }

  // ---- fullscreen photo viewer with swipe left/right through the set ----
  var viewerState = { ids: [], thumbs: [], idx: 0 };

  function viewPhotoSet(idsCsv, idx, thumbsCsv) {
    viewerState.ids = String(idsCsv).split(',').filter(function (x) { return x; });
    viewerState.thumbs = String(thumbsCsv || '').split(',');
    viewerState.idx = Math.max(0, Math.min(Number(idx) || 0, viewerState.ids.length - 1));
    showViewerImg();
    document.getElementById('viewer').classList.add('show');
  }
  function viewPhoto(id, thumbId) { viewPhotoSet(id, 0, thumbId || ''); } // single-photo shortcut

  function showViewerImg() {
    var id = viewerState.ids[viewerState.idx];
    var thumb = viewerState.thumbs[viewerState.idx];
    var v = document.getElementById('viewer-img');
    v.setAttribute('data-img', id);
    v.setAttribute('data-vis', '1'); // viewer lives outside the scroller: fetch directly
    // show the already-downloaded thumbnail INSTANTLY; the sharp full-size
    // photo replaces it as soon as it arrives
    v.src = cachedImg(id) || (thumb && cachedImg(thumb)) || PLACEHOLDER;
    var multi = viewerState.ids.length > 1;
    document.getElementById('viewer-prev').style.display = multi ? 'block' : 'none';
    document.getElementById('viewer-next').style.display = multi ? 'block' : 'none';
    document.getElementById('viewer-count').textContent =
      multi ? (viewerState.idx + 1) + ' / ' + viewerState.ids.length + '  👈 swipe 👉' : '';
    if (multi) { // download the neighbours in the background: swiping feels instant
      var n = viewerState.ids.length;
      prefetchImg(viewerState.ids[(viewerState.idx + 1) % n]);
      prefetchImg(viewerState.ids[(viewerState.idx - 1 + n) % n]);
    }
    loadImages();
  }
  function viewerNav(dir) {
    var n = viewerState.ids.length;
    if (n < 2) return;
    viewerState.idx = (viewerState.idx + dir + n) % n;
    showViewerImg();
  }
  function closeViewer() {
    document.getElementById('viewer').classList.remove('show');
  }

  // gestures: swipe left/right to change photo; tap sides to flip;
  // tap the dark background or ✕ to close; PC: arrows, click sides, arrow keys
  (function () {
    var vEl = document.getElementById('viewer');
    var vs = { sx: 0, dx: 0, active: false };
    vEl.addEventListener('touchstart', function (e) {
      vs.active = true; vs.sx = e.touches[0].clientX; vs.dx = 0;
    }, { passive: true });
    vEl.addEventListener('touchmove', function (e) {
      if (!vs.active) return;
      vs.dx = e.touches[0].clientX - vs.sx;
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    vEl.addEventListener('touchend', function (e) {
      if (!vs.active) return;
      vs.active = false;
      if (e.cancelable) e.preventDefault(); // suppress the synthetic mouse click
      if (vs.dx <= -50) { viewerNav(1); return; }
      if (vs.dx >= 50) { viewerNav(-1); return; }
      var t = e.target;
      if (t && t.id === 'viewer-img' && viewerState.ids.length > 1) {
        var rect = t.getBoundingClientRect();
        viewerNav(vs.sx - rect.left > rect.width / 2 ? 1 : -1);
      } else if (t === vEl) {
        closeViewer();
      } else if (t && t.tagName === 'BUTTON') {
        t.click(); // preventDefault swallowed the click — re-fire it
      }
    });
    vEl.addEventListener('click', function (e) {
      if (e.target === vEl) closeViewer();
    });
    document.getElementById('viewer-img').addEventListener('click', function (e) {
      if (viewerState.ids.length < 2) return;
      var rect = this.getBoundingClientRect();
      viewerNav(e.clientX - rect.left > rect.width / 2 ? 1 : -1);
    });
    window.addEventListener('keydown', function (e) {
      if (!vEl.classList.contains('show')) return;
      if (e.key === 'ArrowRight') viewerNav(1);
      else if (e.key === 'ArrowLeft') viewerNav(-1);
      else if (e.key === 'Escape') closeViewer();
    });
  })();

  // ------------------------------------------------------------ sync status (refresh)
  var syncTimer = null;
  function setSync(txt, autoHideMs) {
    var row = document.getElementById('sync-row');
    clearTimeout(syncTimer);
    if (!txt) { row.style.display = 'none'; return; }
    row.textContent = txt;
    row.style.display = 'block';
    if (autoHideMs) syncTimer = setTimeout(function () { row.style.display = 'none'; }, autoHideMs);
  }
  function refreshSpin(on) {
    document.getElementById('refresh-btn').textContent = on ? '⏳ Refreshing…' : 'Refresh';
  }
  var lastSyncAt = 0;
  function pendingImgCount() {
    // only count photos that are actually queued to load (visible on screen)
    var n = 0, seen = {};
    var els = document.querySelectorAll('img[data-img]');
    for (var i = 0; i < els.length; i++) {
      if (io && !els[i].getAttribute('data-vis')) continue;
      var id = els[i].getAttribute('data-img');
      if (String(id).indexOf('local') === 0) continue;
      if (!cachedImg(id) && !seen[id]) { seen[id] = 1; n++; }
    }
    return n;
  }
  function syncAfterData() {
    var n = pendingImgCount();
    if (n > 0) setSync('📷 Loading photos… (' + n + ' left)');
    else if (lastSyncAt) setSync('✅ Updated at ' + fmtTime(lastSyncAt)); // stays visible
  }
  function syncPhotosTick() {
    var row = document.getElementById('sync-row');
    if (row.style.display !== 'none' && row.textContent.indexOf('photos') >= 0) syncAfterData();
  }
  function manualRefresh() { refresh(); }

  // ------------------------------------------------------------ photo carousel
  function dotsHtml(n, cls) {
    if (n < 2) return '';
    var s = '<div class="' + cls + '">';
    for (var i = 0; i < n; i++) s += '<span class="' + (i === 0 ? 'on' : '') + '"></span>';
    return s + '</div>';
  }

  /** Swipeable photo strip for a job card. Shows THUMBNAILS; tap opens the
      full-size viewer where you can swipe through the whole set. */
  function carouselHtml(j) {
    var n = j.photoIds.length;
    var csv = j.photoIds.join(',');
    var tcsv = j.photoIds.map(function (_, k) { return thumbOf(j, k); }).join(',');
    if (n === 1) {
      return '<div class="carousel">' +
        imgTag(thumbOf(j, 0), '', 'onclick="viewPhotoSet(\'' + csv + '\', 0, \'' + tcsv + '\')"') + '</div>';
    }
    var s = '<div class="carousel"><div class="car-track">';
    for (var i = 0; i < n; i++) {
      s += '<div class="car-slide">' + imgTag(thumbOf(j, i), '', 'onclick="viewPhotoSet(\'' + csv + '\', ' + i + ', \'' + tcsv + '\')"') + '</div>';
    }
    s += '</div>';
    s += '<button class="car-btn prev" onclick="carMove(this,-1)">‹</button>';
    s += '<button class="car-btn next" onclick="carMove(this,1)">›</button>';
    s += '<div class="car-count">' + n + ' 📷</div>';
    s += dotsHtml(n, 'car-dots');
    return s + '</div>';
  }

  function carMove(btn, dir) {
    var track = btn.parentNode.querySelector('.car-track');
    track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
  }

  function attachCarousels() {
    document.querySelectorAll('.car-track').forEach(function (tr) {
      if (tr._wired) return;
      tr._wired = true;
      tr.addEventListener('scroll', function () {
        clearTimeout(tr._t);
        tr._t = setTimeout(function () {
          var idx = Math.round(tr.scrollLeft / tr.clientWidth);
          var dots = tr.parentNode.querySelectorAll('.car-dots span');
          dots.forEach(function (d, i) { d.className = i === idx ? 'on' : ''; });
        }, 80);
      }, { passive: true });
    });
  }

  // ------------------------------------------------------------ helpers
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function timeAgo(ms) {
    if (!ms) return '';
    var d = Date.now() - ms;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + ' min ago';
    if (d < DAY) return Math.floor(d / 3600000) + ' hr ago';
    return Math.floor(d / DAY) + ' days ago';
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(el._h); el._h = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }
  function busy(on, msg) {
    document.getElementById('spinner').style.display = on ? 'flex' : 'none';
    if (on) {
      document.getElementById('spinner-txt').textContent = msg || 'Please wait…';
      priorityHold = 1;          // give this call the network to itself
    } else {
      priorityHold = 0;
      loadImages();              // resume background image loading
    }
  }
  function findJob(id) {
    var list = state.jobs[state.tab];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // jobs cache: last known list per tab renders INSTANTLY on open,
  // then the server refresh replaces it in the background
  var inflightJobs = [];   // jobs whose photos are still uploading
  var localSeq = 0;        // ids for temp local previews
  function saveJobsCache(tab) {
    try {
      var clean = state.jobs[tab].filter(function (j) {
        return !j.uploading && !j.proofUploading && String(j.id).indexOf('local-') !== 0;
      });
      localStorage.setItem('kj_' + tab, JSON.stringify(clean));
    } catch (e) {}
  }

  // ---- "Ready by" due time helpers ----
  function msToHHMM(ms) {
    var d = new Date(Number(ms));
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function hhmmToMs(v) {
    if (!v) return '';
    var p = v.split(':');
    var d = new Date();
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    return d.getTime();
  }
  function fmtTime(ms) {
    var d = new Date(Number(ms));
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + ('0' + m).slice(-2) + ' ' + ap;
  }
  function dueChip(j) {
    if (!j.dueAt) return '';
    var left = Number(j.dueAt) - Date.now();
    if (left < 0) return '<span class="chip late">🚨 LATE — was due ' + fmtTime(j.dueAt) + '</span> ';
    if (left < 3600000) return '<span class="chip soon">⏰ Ready by ' + fmtTime(j.dueAt) + ' — ' + Math.max(1, Math.round(left / 60000)) + ' min left!</span> ';
    return '<span class="chip due">🕒 Ready by ' + fmtTime(j.dueAt) + '</span> ';
  }

  // ---- background upload progress pill ----
  var pillTimer = null;
  function updatePill() {
    var el = document.getElementById('upload-pill');
    clearTimeout(pillTimer);
    if (uploadsPending > 0) {
      el.textContent = '📤 Uploading ' + uploadsPending + ' photo' + (uploadsPending > 1 ? 's' : '') + '…';
      el.style.display = 'block';
    } else {
      el.textContent = '✅ All photos uploaded!';
      pillTimer = setTimeout(function () { el.style.display = 'none'; }, 1800);
      loadImages(); // resume background image loading
    }
  }
  function readJobsCache(tab) {
    try { return JSON.parse(localStorage.getItem('kj_' + tab) || '[]'); } catch (e) { return []; }
  }

  // ------------------------------------------------------------ roles
  function renderRoleBtn() {
    document.getElementById('role-btn').textContent = isAdmin() ? '👔 Admin' : '👷 Staff';
    document.getElementById('reset-btn').style.display = isAdmin() ? 'block' : 'none';
    document.getElementById('cleardone-btn').style.display = isAdmin() ? 'block' : 'none';
  }
  function openRoleModal() {
    document.getElementById('pin-wrap').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('role-overlay').classList.add('show');
  }
  function closeRoleModal() {
    if (!state.role) setRole('staff', '');
    else document.getElementById('role-overlay').classList.remove('show');
  }
  function chooseStaff() { setRole('staff', ''); }
  function showPin() {
    document.getElementById('pin-wrap').style.display = 'block';
    document.getElementById('pin-input').focus();
  }
  function submitPin() {
    var p = document.getElementById('pin-input').value.trim();
    if (!p) { toast('Enter the PIN 🔑'); return; }
    busy(true, 'Checking PIN…');
    // watchdog: the spinner can never hang forever on a bad connection
    var settled = false;
    var dog = setTimeout(function () {
      if (settled) return;
      settled = true;
      busy(false);
      toast('🐢 Slow network — please try again');
    }, window.__PIN_TIMEOUT || 20000);
    google.script.run
      .withSuccessHandler(function (ok) {
        if (settled) return;
        settled = true; clearTimeout(dog);
        busy(false);
        if (ok) { setRole('admin', p); toast('👔 Admin mode on'); }
        else { toast('❌ Wrong PIN'); }
      })
      .withFailureHandler(function (e) {
        if (settled) return;
        settled = true; clearTimeout(dog);
        busy(false); toast('⚠️ ' + e.message);
      })
      .checkPin(p);
  }
  function setRole(role, pin) {
    state.role = role; state.pin = pin;
    localStorage.setItem('kilangRole', role);
    localStorage.setItem('kilangPin', pin);
    document.getElementById('role-overlay').classList.remove('show');
    renderRoleBtn(); renderAll();
  }

  // ------------------------------------------------------------ tabs
  function switchTab(tab) {
    state.tab = tab;
    ['want', 'delivery', 'postage'].forEach(function (x) {
      document.getElementById('page-' + x).classList.toggle('active', x === tab);
      document.getElementById('nav-' + x).classList.toggle('active', x === tab);
    });
    // render the cached list instantly, then refresh from the server
    if (!state.jobs[tab].length) state.jobs[tab] = readJobsCache(tab);
    renderAll();
    refresh();
  }

  function refresh() {
    // ONE round trip refreshes ALL THREE tabs + badges together
    refreshSpin(true);
    setSync('🔄 Updating…');
    google.script.run
      .withSuccessHandler(function (res) {
        ['want', 'delivery', 'postage'].forEach(function (tb) {
          state.jobs[tb] = res.jobs[tb] || [];
          // keep background-uploading jobs visible through a refresh
          inflightJobs.forEach(function (j) {
            if (j.tab !== tb) return;
            var idx = -1;
            for (var k = 0; k < state.jobs[tb].length; k++) {
              if (state.jobs[tb][k].id === j.id) { idx = k; break; }
            }
            if (idx >= 0) state.jobs[tb][idx] = j;
            else state.jobs[tb].unshift(j);
          });
          saveJobsCache(tb);
        });
        lastSyncAt = Date.now();
        renderAll(); renderBadges(res.counts);
        refreshSpin(false);
        syncAfterData();
      })
      .withFailureHandler(function (e) {
        refreshSpin(false);
        setSync('⚠️ Update failed — tap Refresh to retry');
        toast('⚠️ ' + e.message);
      })
      .getAllData();
  }
  function renderBadges(c) {
    ['want', 'delivery', 'postage'].forEach(function (x) {
      var b = document.getElementById('badge-' + x);
      b.style.display = c[x] > 0 ? 'block' : 'none';
      b.textContent = c[x];
    });
  }

  function renderAll() {
    renderWant(); renderDelivery(); renderPostage();
    attachCarousels();
    observeImages();
    loadImages();
  }

  // admin-only tools row (withArchive: finished cards get 🗄️ Hide)
  function toolBtns(j, withArchive) {
    if (!isAdmin()) return '';
    var html = '<div class="tools">' +
      '<button class="t-edit" onclick="openUpload(\'' + j.id + '\')">✏️ Edit</button>' +
      '<button class="t-del" onclick="removeJob(\'' + j.id + '\')">🗑️ Delete</button>';
    if (withArchive) {
      html += '<button class="t-arch" onclick="markJob(\'' + j.id + '\',\'archived\')">🗄️ Hide</button>';
    }
    return html + '</div>';
  }

  /** PUSH UP (Checking page): send a swiped jobsheet BACK to the front of
      the swipe deck so staff must answer seen / not seen again. */
  function askAgainJob(id) {
    var j = findJob(id);
    if (!j) return;
    j.status = 'pending';
    j.doneAt = '';
    j.pinnedAt = Date.now();   // front of the deck
    saveJobsCache(state.tab);
    renderAll(); updateBadgeLocal();
    toast('🔁 Sent back — staff must swipe again!');
    google.script.run.withFailureHandler(bgFail).askAgain(id, state.pin);
  }

  /** UNDO a wrong swipe (staff AND admin, no PIN): the jobsheet returns to
      the FRONT of the swipe deck so it can be answered again. */
  function undoSwipeNow() {
    var ls = state.lastSwipe;
    if (!ls) return;
    state.lastSwipe = null;
    var list = state.jobs.want;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === ls.id) {
        list[i].status = 'pending'; list[i].doneAt = ''; list[i].pinnedAt = Date.now();
        break;
      }
    }
    saveJobsCache('want');
    renderAll(); updateBadgeLocal();
    toast('↩️ Swipe undone — please answer again.');
    google.script.run.withFailureHandler(bgFail).undoSwipe(ls.id);
  }

  // ------------------------------------------------------------ TAB 1: checking (swipe)
  function renderWant() {
    var jobs = state.jobs.want;
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var responded = jobs.filter(function (j) { return j.status === 'got' || j.status === 'notseen'; });
    // pushed-up jobsheets jump to the front of the swipe deck
    pending.sort(function (a, b) { return Number(b.pinnedAt || 0) - Number(a.pinnedAt || 0); });
    var area = document.getElementById('want-stack-area');

    // undo bar: right after a swipe, one tap brings the jobsheet back
    var undoHtml = '';
    var ls = state.lastSwipe;
    if (ls && Date.now() - ls.at < 60000) {
      var lj = jobs.find(function (x) { return x.id === ls.id; });
      if (lj && (lj.status === 'got' || lj.status === 'notseen')) {
        undoHtml = '<div class="undo-bar" id="undo-bar">Swiped ' +
          (ls.status === 'got' ? '❤️ Got It' : '❌ Not Seen') + ' — wrong?' +
          '<button onclick="undoSwipeNow()">↩️ UNDO</button></div>';
      }
    }

    if (pending.length === 0) {
      area.innerHTML = undoHtml + '<div class="empty"><span class="big">🎉</span>No new jobsheets!' +
        '<br><span class="hint">Tap ＋ Post below to add one</span></div>';
    } else {
      var html = undoHtml + '<div class="stack-outer">';
      html += '<div class="swipe-help">👈 ❌ Not seen &nbsp;|&nbsp; ❤️ Got it 👉</div>';
      html += '<div class="stack-wrap" id="stack">';
      var show = pending.slice(0, 3).reverse();   // last in DOM = top of stack
      for (var i = 0; i < show.length; i++) {
        var j = show[i];
        var top = (i === show.length - 1);
        var multi = j.photoIds.length > 1;
        html += '<div class="swipe-card" data-id="' + j.id + '" data-photos="' + j.photoIds.join(',') + '" data-idx="0" ' +
          (top ? 'id="topcard"' : '') + '>' +
          imgTag(j.photoIds[0]) +   // full image on the big card: must be readable
          (multi ? dotsHtml(j.photoIds.length, 'stack-dots') +
                   '<div class="stack-hint">👆 Tap left / right side for more photos</div>' : '') +
          '<div class="foot">' +
            '<div class="cap">' + (j.uploading ? '📤 Uploading… · ' : '') + (j.pinnedAt ? '📌 ' : '') +
            '📄 ' + (esc(j.note) || 'Jobsheet') +
            (multi ? ' · ' + j.photoIds.length + ' 📷' : '') +
            ' · ' + timeAgo(j.createdAt) + ' · ' + pending.length + ' left</div>' +
            (j.uploading ? '' : toolBtns(j, false)) +
          '</div>' +
          '<div class="stamp yes">❤️</div><div class="stamp no">❌</div>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="btn-row">' +
        '<button class="btn red" onclick="swipeAction(\'notseen\')">❌ Not Seen</button>' +
        '<button class="btn green" onclick="swipeAction(\'got\')">❤️ Got It</button></div>';
      html += '</div>';
      area.innerHTML = html;
      attachSwipe();
    }

    var r = document.getElementById('want-responded');
    if (responded.length === 0) { r.innerHTML = ''; return; }

    // separate by status: Not Seen first (needs follow-up), then Got It
    var notSeen = responded.filter(function (j) { return j.status === 'notseen'; });
    var got = responded.filter(function (j) { return j.status === 'got'; });

    function statusCard(j, isGot) {
      return '<div class="card">' + carouselHtml(j) +
        '<div class="body">' +
        (j.note ? '<div class="note" style="font-size:15px">📄 ' + esc(j.note) + '</div>' : '') +
        '<div class="meta">' + (isGot ? '❤️ Got it · ' : '❌ Swiped · ') + timeAgo(j.doneAt) + '</div>' +
        (!isGot ? '<button class="btn green small" style="margin-top:8px" onclick="markJob(\'' + j.id + '\',\'got\')">❤️ Found it</button>' : '') +
        (isAdmin() ? '<button class="ask-btn" onclick="askAgainJob(\'' + j.id + '\')">⬆️ Push Up — ask staff again</button>' : '') +
        '<div class="spacer"></div>' +
        toolBtns(j, true) +
        '</div></div>';
    }

    var html2 = '';
    if (notSeen.length) {
      html2 += '<div class="section-title" style="color:#b91c1c">❌ Not Seen (' + notSeen.length + ')</div><div class="grid">';
      notSeen.forEach(function (j) { html2 += statusCard(j, false); });
      html2 += '</div>';
    }
    if (got.length) {
      html2 += '<div class="section-title">❤️ Got It (' + got.length + ')</div><div class="grid">';
      got.forEach(function (j) { html2 += statusCard(j, true); });
      html2 += '</div>';
    }
    r.innerHTML = html2;
  }

  /** Tap left/right side of the top swipe card to flip between its photos. */
  function stackTap(card, clientX) {
    var ids = (card.getAttribute('data-photos') || '').split(',');
    if (ids.length < 2) return;
    var idx = parseInt(card.getAttribute('data-idx') || '0', 10);
    var rect = card.getBoundingClientRect();
    var dir = (clientX - rect.left) > rect.width / 2 ? 1 : -1;
    idx = (idx + dir + ids.length) % ids.length;
    card.setAttribute('data-idx', idx);
    var img = card.querySelector('img[data-img]');
    img.setAttribute('data-img', ids[idx]);
    img.src = cachedImg(ids[idx]) || PLACEHOLDER;
    var dots = card.querySelectorAll('.stack-dots span');
    dots.forEach(function (d, i) { d.className = i === idx ? 'on' : ''; });
    loadImages();
  }

  // Direction-locked swipe: vertical finger movement scrolls the page
  // normally; only a clearly horizontal drag moves the card.
  var swipe = { card: null, sx: 0, sy: 0, dx: 0, mode: 'idle', yes: null, no: null };

  function swipeMove(x) {
    swipe.dx = x - swipe.sx;
    swipe.card.style.transform = 'translateX(' + swipe.dx + 'px) rotate(' + (swipe.dx / 18) + 'deg)';
    swipe.yes.style.opacity = swipe.dx > 30 ? Math.min(1, swipe.dx / 110) : 0;
    swipe.no.style.opacity = swipe.dx < -30 ? Math.min(1, -swipe.dx / 110) : 0;
  }
  function swipeFinish() {
    var card = swipe.card, dx = swipe.dx;
    if (dx > 110) flyOut(card, 1, 'got');
    else if (dx < -110) flyOut(card, -1, 'notseen');
    else {
      card.style.transition = 'transform .2s'; card.style.transform = '';
      swipe.yes.style.opacity = 0; swipe.no.style.opacity = 0;
      setTimeout(function () { card.style.transition = ''; }, 220);
    }
  }

  function attachSwipe() {
    var card = document.getElementById('topcard');
    if (!card) return;

    card.addEventListener('touchstart', function (e) {
      if (e.target.closest('button')) { swipe.mode = 'idle'; return; }
      swipe.card = card;
      swipe.yes = card.querySelector('.stamp.yes');
      swipe.no = card.querySelector('.stamp.no');
      swipe.sx = e.touches[0].clientX; swipe.sy = e.touches[0].clientY;
      swipe.dx = 0; swipe.mode = 'maybe';
    }, { passive: true });

    card.addEventListener('touchmove', function (e) {
      if (swipe.mode === 'idle' || swipe.mode === 'scroll' || swipe.card !== card) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (swipe.mode === 'maybe') {
        var adx = Math.abs(x - swipe.sx), ady = Math.abs(y - swipe.sy);
        if (ady > 12 && ady > adx) { swipe.mode = 'scroll'; return; } // vertical → page scrolls
        if (adx > 12 && adx > ady) swipe.mode = 'drag';
        else return;
      }
      if (swipe.mode === 'drag') {
        if (e.cancelable) e.preventDefault(); // we own this gesture now
        swipeMove(x);
      }
    }, { passive: false });

    card.addEventListener('touchend', function (e) {
      if (swipe.card !== card) return;
      if (swipe.mode === 'drag') {
        swipeFinish();
        if (e.cancelable) e.preventDefault(); // stop the follow-up synthetic mouse events
      } else if (swipe.mode === 'maybe') {
        stackTap(card, swipe.sx); // small movement = tap
        // browsers fire mousedown/mouseup AFTER a tap; without this the
        // mouse path would run stackTap again and flip the photo back
        if (e.cancelable) e.preventDefault();
      }
      swipe.mode = 'idle';
    });

    card.addEventListener('mousedown', function (e) {
      if (e.target.closest('button')) return;
      swipe.card = card;
      swipe.yes = card.querySelector('.stamp.yes');
      swipe.no = card.querySelector('.stamp.no');
      swipe.sx = e.clientX; swipe.dx = 0; swipe.mode = 'mouse';
      e.preventDefault();
    });
  }
  // single global mouse handlers (attachSwipe runs per render; these do not stack)
  window.addEventListener('mousemove', function (e) {
    if (swipe.mode === 'mouse') swipeMove(e.clientX);
  });
  window.addEventListener('mouseup', function () {
    if (swipe.mode !== 'mouse') return;
    if (Math.abs(swipe.dx) < 8) stackTap(swipe.card, swipe.sx);
    else swipeFinish();
    swipe.mode = 'idle';
  });

  function flyOut(card, dir, status) {
    var id = card.getAttribute('data-id');
    var j = findJob(id);
    if (j && j.uploading) {
      toast('📤 Still uploading — wait a moment');
      card.style.transition = 'transform .2s'; card.style.transform = '';
      setTimeout(function () { card.style.transition = ''; }, 220);
      return;
    }
    card.style.transition = 'transform .3s, opacity .3s';
    card.style.transform = 'translateX(' + (dir * window.innerWidth) + 'px) rotate(' + (dir * 30) + 'deg)';
    card.style.opacity = '0';
    setTimeout(function () { markJob(id, status); }, 250);
  }

  function swipeAction(status) {
    var card = document.getElementById('topcard');
    if (card) flyOut(card, status === 'got' ? 1 : -1, status);
  }

  // ------------------------------------------------------------ TAB 2: delivery
  document.getElementById('delivery-pills').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.deliveryCat = b.getAttribute('data-cat');
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    renderDelivery(); attachCarousels(); loadImages();
  });

  function renderDelivery() {
    var jobs = state.jobs.delivery.filter(function (j) {
      return !state.deliveryCat || j.category === state.deliveryCat;
    });
    document.getElementById('delivery-list').innerHTML = renderJobList(jobs);
  }

  // ------------------------------------------------------------ TAB 3: postage
  function renderPostage() {
    document.getElementById('postage-list').innerHTML = renderJobList(state.jobs.postage);
  }

  function renderJobList(jobs) {
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var done = jobs.filter(function (j) { return j.status === 'done'; });
    // most urgent deadline first; jobs without a deadline after, newest first
    pending.sort(function (a, b) {
      var da = a.dueAt ? Number(a.dueAt) : Infinity;
      var db2 = b.dueAt ? Number(b.dueAt) : Infinity;
      if (da !== db2) return da - db2;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    var html = '';

    if (pending.length === 0 && done.length === 0) {
      return '<div class="empty"><span class="big">📭</span>Nothing here yet.' +
        '<br><span class="hint">Tap ＋ Post below to add a job</span></div>';
    }

    if (pending.length) {
      html += '<div class="section-title">⏳ To Do (' + pending.length + ')</div><div class="grid">';
      pending.forEach(function (j) { html += jobCard(j, false); });
      html += '</div>';
    }
    if (done.length) {
      html += '<div class="section-title">✅ Done (' + done.length + ')</div><div class="grid">';
      done.forEach(function (j) { html += jobCard(j, true); });
      html += '</div>';
    }
    return html;
  }

  /** Postage: how many of the job's photos are Jobsheet pages (rest = Waybill). */
  function jsCountOf(j) {
    var n = Number(j.jsCount || 0);
    if (n > 0 && n < j.photoIds.length) return n;
    // legacy jobs without the split: first photo = jobsheet, rest = waybill
    return j.photoIds.length > 1 ? 1 : j.photoIds.length;
  }

  /** One half of the postage card: its own swipeable mini-carousel.
      Tapping opens the viewer scoped to THIS group's photos only. */
  function miniCarousel(j, start, end, label) {
    var count = end - start;
    var csv = j.photoIds.slice(start, end).join(',');
    var tcsv = j.photoIds.slice(start, end).map(function (_, k) { return thumbOf(j, start + k); }).join(',');
    var inner;
    if (count <= 1) {
      inner = imgTag(thumbOf(j, start), '', 'onclick="viewPhotoSet(\'' + csv + '\', 0, \'' + tcsv + '\')"');
    } else {
      inner = '<div class="car-track">';
      for (var i = start; i < end; i++) {
        inner += '<div class="car-slide">' + imgTag(thumbOf(j, i), '', 'onclick="viewPhotoSet(\'' + csv + '\', ' + (i - start) + ', \'' + tcsv + '\')"') + '</div>';
      }
      inner += '</div>' +
        '<button class="car-btn prev" onclick="carMove(this,-1)">‹</button>' +
        '<button class="car-btn next" onclick="carMove(this,1)">›</button>' +
        '<div class="car-count">' + count + ' 📷</div>' +
        dotsHtml(count, 'car-dots');
    }
    return '<div class="carousel"><span class="lbl">' + label + '</span>' + inner + '</div>';
  }

  /** Postage: Jobsheet photos on the left, Waybill photos on the right —
      each side shows its 1st photo and swipes left/right through the rest. */
  function pairHtml(j) {
    var n = jsCountOf(j);
    return '<div class="photo-pair">' +
      miniCarousel(j, 0, n, '📄 Jobsheet') +
      miniCarousel(j, n, j.photoIds.length, '🏷️ Waybill') +
      '</div>';
  }

  function jobCard(j, isDone) {
    var old = !isDone && (Date.now() - j.createdAt > DAY);
    var media = (j.tab === 'postage' && j.photoIds.length >= 2 && j.photoIds[0] && j.photoIds[1])
      ? pairHtml(j) : carouselHtml(j);
    var html = '<div class="card">' + media;

    html += '<div class="body">';
    if (j.uploading) html += '<span class="chip up">📤 Uploading…</span> ';
    if (j.category) html += '<span class="chip ' + j.category + '">' + CAT_LABEL[j.category] + '</span> ';
    if (!isDone) html += dueChip(j);
    if (old) html += '<span class="chip old">⚠️ Over 1 day!</span>';
    if (j.note) html += '<div class="note">📢 ' + esc(j.note) + '</div>';
    html += '<div class="meta">Posted ' + timeAgo(j.createdAt) + '</div>';

    if (isDone) {
      html += '<div class="proof">' +
        (j.proofPhotoId ? imgTag(proofThumbOf(j), '', 'onclick="viewPhoto(\'' + j.proofPhotoId + '\', \'' + proofThumbOf(j) + '\')"') : '') +
        '<div class="txt">' + (j.proofUploading ? '📤 Done · proof uploading…' : '✅ Done · ' + timeAgo(j.doneAt)) + '</div></div>';
      // proof tools are for EVERYONE — staff can fix a wrong proof photo
      if (!j.proofUploading && !j.uploading) {
        html += '<div class="tools proof-tools">' +
          '<button class="t-reproof" onclick="startReProof(\'' + j.id + '\')">📷 Retake Proof</button>' +
          '<button class="t-delproof" onclick="removeProof(\'' + j.id + '\')">🗑️ Remove Proof</button></div>';
      }
      html += '<div class="spacer"></div>' + (j.proofUploading ? '' : toolBtns(j, true));
    } else {
      html += '<div class="spacer"></div>';
      if (!j.uploading) {
        html += '<button class="btn green" style="margin-top:10px" onclick="startProof(\'' + j.id + '\')">📸 Done! Take Proof Photo</button>';
        html += toolBtns(j, false);
      }
    }
    html += '</div></div>';
    return html;
  }

  // ------------------------------------------------------------ status updates / delete / reset
  function bgFail(e) { toast('⚠️ ' + e.message); refresh(); }

  function updateBadgeLocal() {
    var n = state.jobs[state.tab].filter(function (j) { return j.status === 'pending'; }).length;
    var b = document.getElementById('badge-' + state.tab);
    b.style.display = n > 0 ? 'block' : 'none';
    b.textContent = n;
  }

  function markJob(id, status) {
    var j = findJob(id);
    if (j && j.uploading) { toast('📤 Still uploading — wait a moment'); renderAll(); return; }
    if (j) {
      if (status === 'archived') {
        state.jobs[state.tab] = state.jobs[state.tab].filter(function (x) { return x.id !== id; });
      } else {
        j.status = status; j.doneAt = Date.now();
      }
      saveJobsCache(state.tab);
      if (status === 'got' || status === 'notseen') {
        state.lastSwipe = { id: id, status: status, at: Date.now() };
      }
      renderAll(); updateBadgeLocal();
    }
    if (status === 'got') toast('❤️ Great!');
    if (status === 'notseen') toast('❌ Office will follow up.');
    if (status === 'archived') toast('🗄️ Hidden.');
    google.script.run.withFailureHandler(bgFail).updateStatus(id, status, null, null, state.pin);
  }

  // generic confirm modal — window.confirm() can be silently blocked
  // inside the Apps Script sandbox iframe
  var confirmCb = null;
  function askConfirm(msg, yesLabel, cb) {
    confirmCb = cb;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-yes').textContent = yesLabel;
    document.getElementById('confirm-overlay').classList.add('show');
  }
  function closeConfirm() {
    confirmCb = null;
    document.getElementById('confirm-overlay').classList.remove('show');
  }
  function confirmYes() {
    var cb = confirmCb;
    closeConfirm();
    if (cb) cb();
  }

  function removeJob(id) {
    var j = findJob(id);
    if (j && (j.uploading || j.proofUploading)) { toast('📤 Still uploading — wait a moment'); return; }
    askConfirm('Delete this job? Cannot undo!', '🗑️ Yes, Delete', function () {
      state.jobs[state.tab] = state.jobs[state.tab].filter(function (j) { return j.id !== id; });
      saveJobsCache(state.tab);
      renderAll(); updateBadgeLocal();
      toast('🗑️ Deleted.');
      google.script.run.withFailureHandler(bgFail).deleteJob(id, state.pin);
    });
  }

  // RESET now opens a SAFETY MENU first — one accidental tap can no longer
  // wipe the day, and a wrong choice can be undone.
  function askReset() {
    document.getElementById('reset-overlay').classList.add('show');
  }
  function closeResetMenu() {
    document.getElementById('reset-overlay').classList.remove('show');
  }
  function clearDoneFromMenu() {
    closeResetMenu();
    askClearDone();
  }
  function resetAllFromMenu() {
    closeResetMenu();
    askConfirm('⚠️ Wipe ALL jobs in ALL tabs — finished AND unfinished? (You can UNDO from the Reset menu.)',
      '🧹 Yes, RESET ALL', function () {
        state.jobs = { want: [], delivery: [], postage: [] };
        ['want', 'delivery', 'postage'].forEach(saveJobsCache);
        renderAll();
        renderBadges({ want: 0, delivery: 0, postage: 0 });
        toast('🔄 Fresh day! All tabs cleared.');
        google.script.run
          .withFailureHandler(function (e) { toast('⚠️ ' + e.message); refresh(); })
          .resetAll(state.pin);
      });
  }
  /** Bring back everything the LAST reset archived (statuses restored). */
  function undoLastReset() {
    closeResetMenu();
    toast('↩️ Restoring the last reset…');
    google.script.run
      .withSuccessHandler(function (res) {
        toast('↩️ Restored ' + res.restored + ' jobs — welcome back!');
        refresh();
      })
      .withFailureHandler(function (e) { toast('⚠️ ' + e.message); })
      .undoReset(state.pin);
  }

  /** CLEAR DONE (admin): archive ONLY finished work — done Delivery/Postage
      jobs + Got It jobsheets. Unfinished jobs carry forward to the next day. */
  function askClearDone() {
    askConfirm('Clear FINISHED work only? Completed jobs and ❤️ Got It jobsheets are archived. Unfinished jobs stay for the next day.',
      '✅ Yes, Clear Done', function () {
        ['want', 'delivery', 'postage'].forEach(function (tb) {
          state.jobs[tb] = state.jobs[tb].filter(function (j) {
            return !(j.status === 'done' || (tb === 'want' && j.status === 'got'));
          });
          saveJobsCache(tb);
        });
        renderAll(); updateBadgeLocal();
        toast('✅ Finished work cleared — unfinished carried forward.');
        google.script.run
          .withFailureHandler(function (e) { toast('⚠️ ' + e.message); refresh(); })
          .resetDone(state.pin);
      });
  }

  function startProof(jobId) {
    state.proofJobId = jobId;
    state.reProof = false;
    document.getElementById('proof-file').click();
  }
  /** Retake the proof photo on a done job — staff AND admin. */
  function startReProof(jobId) {
    var j = findJob(jobId);
    if (j && (j.uploading || j.proofUploading)) { toast('📤 Still uploading — wait a moment'); return; }
    state.proofJobId = jobId;
    state.reProof = true;
    document.getElementById('proof-file').click();
  }
  function proofPicked(input) {
    if (!input.files || !input.files[0]) return;
    var id = state.proofJobId;
    var redo = state.reProof;
    var jobTab = state.tab;
    compressImage(input.files[0], function (img) {
      // NON-BLOCKING: update the screen instantly, upload in the background
      var j = findJob(id);
      var tempKey = 'localproof-' + (++localSeq);
      imgCache[tempKey] = 'data:image/jpeg;base64,' + img.thumb;
      if (j) {
        if (!redo) { j.status = 'done'; j.doneAt = Date.now(); }
        j.proofPhotoId = tempKey; j.proofThumbId = tempKey;
        j.proofUploading = true;
        inflightJobs.push(j);
      }
      renderAll(); updateBadgeLocal();
      toast(redo ? '📷 New proof photo uploading… 🙏' : '✅ Done! Proof uploading… 🙏');
      uploadsPending++; updatePill();
      var run = google.script.run
        .withSuccessHandler(function (res) {
          uploadsPending--; updatePill();
          seedImage(res.proofPhotoId, img.full);
          seedImage(res.proofThumbId, img.thumb);
          if (j) {
            j.proofPhotoId = res.proofPhotoId; j.proofThumbId = res.proofThumbId;
            if (res.doneAt) j.doneAt = res.doneAt;
            delete j.proofUploading;
            inflightJobs = inflightJobs.filter(function (x) { return x !== j; });
            saveJobsCache(jobTab); renderAll();
          }
        })
        .withFailureHandler(function (e) {
          uploadsPending--; updatePill();
          if (j) { delete j.proofUploading; inflightJobs = inflightJobs.filter(function (x) { return x !== j; }); }
          toast('⚠️ ' + e.message); refresh();
        });
      if (redo) run.updateProof(id, img.full, img.thumb);
      else run.updateStatus(id, 'done', img.full, img.thumb, null);
    });
    input.value = '';
  }

  /** Remove the proof photo — the job goes BACK to To Do. Staff AND admin. */
  function removeProof(id) {
    var j = findJob(id);
    if (j && (j.uploading || j.proofUploading)) { toast('📤 Still uploading — wait a moment'); return; }
    askConfirm('Remove the proof photo? This job goes BACK to To Do.', '🗑️ Yes, Remove', function () {
      if (j) {
        j.status = 'pending'; j.doneAt = ''; j.proofPhotoId = ''; j.proofThumbId = '';
        saveJobsCache(state.tab);
        renderAll(); updateBadgeLocal();
      }
      toast('🗑️ Proof removed — job is back in To Do.');
      google.script.run.withFailureHandler(bgFail).deleteProof(id);
    });
  }

  // ------------------------------------------------------------ upload & edit modal
  function openUpload(editId) {
    var job = editId ? findJob(editId) : null;
    if (editId && !job) return;
    if (job && !isAdmin()) { toast('Admin only'); return; }
    if (job && job.uploading) { toast('📤 Still uploading — wait a moment'); return; }
    state.editing = job;
    state.upload = { photos: [], js: [], wb: [], cat: job ? (job.category || '') : '' };
    if (job) {
      var split = state.tab === 'postage' ? jsCountOf(job) : -1;
      job.photoIds.forEach(function (id, i) {
        var item = { id: id, thumbId: (job.thumbIds && job.thumbIds[i]) || '' };
        if (split < 0) state.upload.photos.push(item);
        else (i < split ? state.upload.js : state.upload.wb).push(item);
      });
    }

    var titles = {
      want: '🔍 Post New Jobsheet',
      delivery: '🚚 Post Delivery Instruction',
      postage: '📦 Post Airway Bill + Jobsheet'
    };
    document.getElementById('upload-title').textContent = job ? '✏️ Edit Job' : titles[state.tab];
    document.getElementById('upload-cat-wrap').style.display = state.tab === 'delivery' ? 'block' : 'none';
    // postage: two separate photo groups (Jobsheet / Waybill)
    var isPost = state.tab === 'postage';
    document.getElementById('generic-photos').style.display = isPost ? 'none' : 'block';
    document.getElementById('postage-groups').style.display = isPost ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = job ? '💾 Save' : '📤 Post';
    document.getElementById('upload-note').value = job ? (job.note || '') : '';
    document.getElementById('due-wrap').style.display =
      (state.tab === 'delivery' || state.tab === 'postage') ? 'block' : 'none';
    document.getElementById('upload-due').value = (job && job.dueAt) ? msToHHMM(job.dueAt) : '';

    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', !!job && b.getAttribute('data-cat') === job.category);
    });

    renderAllThumbs();
    document.getElementById('upload-overlay').classList.add('show');
    loadImages();
  }
  function closeUpload() { document.getElementById('upload-overlay').classList.remove('show'); }

  function pickCat(btn) {
    state.upload.cat = btn.getAttribute('data-cat');
    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }

  // photo groups in the post window: 'main' (Checking/Delivery),
  // 'js' = postage Jobsheet photos, 'wb' = postage Waybill photos
  function grp(g) { return g === 'js' ? state.upload.js : (g === 'wb' ? state.upload.wb : state.upload.photos); }
  function grpBoxId(g) { return g === 'js' ? 'js-thumbs' : (g === 'wb' ? 'wb-thumbs' : 'upload-thumbs'); }
  function totalUploadPhotos() {
    return state.upload.photos.length + state.upload.js.length + state.upload.wb.length;
  }

  function renderThumbsG(g) {
    var arr = grp(g), n = arr.length, html = '';
    arr.forEach(function (p, i) {
      html += '<div class="thumb-wrap"><div class="thumb">' +
        (p.b64 ? '<img src="data:image/jpeg;base64,' + (p.thumb || p.b64) + '">' : imgTag(p.thumbId || p.id)) +
        '<button class="thumb-x" onclick="removePhotoG(\'' + g + '\',' + i + ')">✕</button>' +
        '<span class="thumb-n">' + (i + 1) + '</span>' +
        '</div>' +
        (n > 1
          ? '<div class="thumb-arrows">' +
            (i > 0 ? '<button onclick="movePhotoG(\'' + g + '\',' + i + ',-1)">◀</button>' : '') +
            (i < n - 1 ? '<button onclick="movePhotoG(\'' + g + '\',' + i + ',1)">▶</button>' : '') +
            '</div>'
          : '') +
        // uploaded to the wrong group? one tap moves it to the other one
        (g === 'js' ? '<button class="thumb-move" onclick="transferPhoto(\'js\',' + i + ')">⬇️ To Waybill</button>' : '') +
        (g === 'wb' ? '<button class="thumb-move" onclick="transferPhoto(\'wb\',' + i + ')">⬆️ To Jobsheet</button>' : '') +
        '</div>';
    });
    var box = document.getElementById(grpBoxId(g));
    box.innerHTML = html;
    // the modal lives outside the scroller, so mark its images as visible
    var els = box.querySelectorAll('img[data-img]');
    for (var k = 0; k < els.length; k++) els[k].setAttribute('data-vis', '1');
  }

  /** Move a photo between the Jobsheet and Waybill groups. */
  function transferPhoto(g, i) {
    var from = grp(g), to = g === 'js' ? state.upload.wb : state.upload.js;
    var p = from.splice(i, 1)[0];
    if (!p) return;
    to.push(p);
    renderAllThumbs();
    toast(g === 'js' ? '🏷️ Moved to Waybill' : '📄 Moved to Jobsheet');
  }
  function renderAllThumbs() {
    if (state.tab === 'postage') { renderThumbsG('js'); renderThumbsG('wb'); }
    else renderThumbsG('main');
    loadImages();
  }
  function removePhotoG(g, i) {
    grp(g).splice(i, 1);
    renderAllThumbs();
  }
  /** ◀ ▶ rearrange photo order (within its own group) before posting */
  function movePhotoG(g, i, dir) {
    var arr = grp(g), k = i + dir;
    if (k < 0 || k >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[k]; arr[k] = tmp;
    renderAllThumbs();
  }

  function photosPickedG(input, g) {
    if (!input.files || !input.files.length) return;
    var files = Array.prototype.slice.call(input.files);
    input.value = '';
    var room = MAX_PHOTOS - totalUploadPhotos();
    if (files.length > room) {
      toast('Max ' + MAX_PHOTOS + ' photos per job');
      files = files.slice(0, room);
      if (!files.length) return;
    }
    busy(true, 'Preparing photos…');
    var remaining = files.length;
    files.forEach(function (f) {
      compressImage(f, function (img) {
        grp(g).push({ b64: img.full, thumb: img.thumb });
        remaining--;
        if (remaining === 0) { busy(false); renderAllThumbs(); }
      });
    });
  }

  function submitUpload() {
    var note = document.getElementById('upload-note').value.trim();
    var hasDue = state.tab === 'delivery' || state.tab === 'postage';
    var dueMs = hasDue ? hhmmToMs(document.getElementById('upload-due').value) : '';

    var photos, jsCount = 0;
    if (state.tab === 'postage') {
      if (!state.upload.js.length) { toast('Please add a Jobsheet photo 📄'); return; }
      if (!state.upload.wb.length) { toast('Please add a Waybill photo 🏷️'); return; }
      photos = state.upload.js.concat(state.upload.wb);
      jsCount = state.upload.js.length;
    } else {
      photos = state.upload.photos;
      if (!photos.length) { toast('Please add a photo first 📸'); return; }
    }
    if (state.tab === 'delivery' && !state.upload.cat) { toast('Choose delivery method first 🛵🚌🤝'); return; }

    if (state.editing) {
      busy(true, 'Saving changes… 💾');
      var spec = photos.map(function (p) {
        return p.b64 ? { b64: p.b64, thumb: p.thumb } : { id: p.id, thumbId: p.thumbId };
      });
      var editTab = state.tab;
      google.script.run
        .withSuccessHandler(function (job) {
          for (var i = 0; i < spec.length; i++) {
            if (spec[i].b64) {
              seedImage(job.photoIds[i], spec[i].b64);
              seedImage(job.thumbIds[i], spec[i].thumb);
            }
          }
          var list = state.jobs[editTab];
          for (var k = 0; k < list.length; k++) if (list[k].id === job.id) { list[k] = job; break; }
          saveJobsCache(editTab);
          busy(false); closeUpload(); renderAll(); updateBadgeLocal();
          toast('💾 Saved!');
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
        .editJob(state.editing.id, {
          note: note,
          category: state.tab === 'delivery' ? state.upload.cat : (state.editing.category || ''),
          dueAt: dueMs,
          jsCount: jsCount,
          photos: spec
        }, state.pin);
      return;
    }

    // ---- NON-BLOCKING POST ----
    // The job appears on screen instantly (from the local photos) and the
    // modal closes right away. Photo 1 creates the job; the remaining photos
    // upload in PARALLEL in the background (wall time = slowest photo, not
    // the sum). The pill at the bottom shows live progress.
    var fulls = photos.map(function (p) { return p.b64; });
    var thumbs = photos.map(function (p) { return p.thumb; });
    var postTab = state.tab;
    var tempPhotoIds = [], tempThumbIds = [];
    localSeq++;
    for (var i = 0; i < fulls.length; i++) {
      var pk = 'localp-' + localSeq + '-' + i, tk = 'localt-' + localSeq + '-' + i;
      imgCache[pk] = 'data:image/jpeg;base64,' + fulls[i];
      imgCache[tk] = 'data:image/jpeg;base64,' + (thumbs[i] || fulls[i]);
      tempPhotoIds.push(pk); tempThumbIds.push(tk);
    }
    var tempJob = {
      id: 'local-' + localSeq, tab: postTab, category: state.upload.cat, note: note,
      photoIds: tempPhotoIds, thumbIds: tempThumbIds, status: 'pending',
      createdAt: Date.now(), doneAt: '', proofPhotoId: '', proofThumbId: '',
      dueAt: dueMs, jsCount: jsCount, uploading: true
    };
    state.jobs[postTab].unshift(tempJob);
    inflightJobs.push(tempJob);
    closeUpload(); renderAll(); updateBadgeLocal();
    toast('📤 Posting…');
    uploadsPending += fulls.length; updatePill();

    function finishPost() {
      delete tempJob.uploading;
      inflightJobs = inflightJobs.filter(function (x) { return x !== tempJob; });
      saveJobsCache(postTab);
      renderAll(); updateBadgeLocal();
      toast('✅ Posted!');
    }

    google.script.run
      .withSuccessHandler(function (job) {
        uploadsPending--; updatePill();
        seedImage(job.photoIds[0], fulls[0]);
        seedImage(job.thumbIds[0], thumbs[0]);
        tempJob.id = job.id;
        tempJob.createdAt = job.createdAt;
        tempJob.photoIds[0] = job.photoIds[0];
        tempJob.thumbIds[0] = job.thumbIds[0];
        var remaining = fulls.length - 1;
        if (remaining === 0) { finishPost(); return; }
        for (var idx = 1; idx < fulls.length; idx++) {
          (function (ix) {
            google.script.run
              .withSuccessHandler(function (res) {
                uploadsPending--; updatePill();
                seedImage(res.photoId, fulls[ix]);
                seedImage(res.thumbId, thumbs[ix]);
                tempJob.photoIds[ix] = res.photoId;
                tempJob.thumbIds[ix] = res.thumbId;
                remaining--;
                if (remaining === 0) finishPost();
              })
              .withFailureHandler(function (e) {
                uploadsPending--; updatePill();
                remaining--;
                toast('⚠️ One photo failed: ' + e.message);
                if (remaining === 0) finishPost();
              })
              .addPhotoToJob(tempJob.id, ix, fulls[ix], thumbs[ix]);
          })(idx);
        }
      })
      .withFailureHandler(function (e) {
        uploadsPending -= fulls.length; updatePill();
        inflightJobs = inflightJobs.filter(function (x) { return x !== tempJob; });
        state.jobs[postTab] = state.jobs[postTab].filter(function (x) { return x !== tempJob; });
        renderAll(); updateBadgeLocal();
        toast('⚠️ Post failed: ' + e.message + ' — please try again');
      })
      .addJob({
        tab: postTab,
        category: tempJob.category,
        note: note,
        photos: [fulls[0]],
        thumbs: [thumbs[0]],
        dueAt: dueMs,
        jsCount: jsCount
      });
  }

  // close any modal by clicking/tapping the dark backdrop
  ['upload-overlay', 'role-overlay', 'confirm-overlay', 'reset-overlay'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      if (e.target !== this) return;
      if (id === 'role-overlay') closeRoleModal();
      else if (id === 'confirm-overlay') closeConfirm();
      else if (id === 'reset-overlay') closeResetMenu();
      else closeUpload();
    });
  });

  // ------------------------------------------------------------ image compression
  /** Produces BOTH sizes in one pass: full (1280px, for zoom) + thumb (480px, for cards). */
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        function scale(max, q) {
          var w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          return c.toDataURL('image/jpeg', q).split(',')[1];
        }
        cb({ full: scale(1280, 0.8), thumb: scale(480, 0.7) });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ------------------------------------------------------------ boot
  renderRoleBtn();
  if (state.role !== 'admin' && state.role !== 'staff') {
    document.getElementById('role-overlay').classList.add('show');
  }
  // instant first paint from cache, then live refresh
  state.jobs.want = readJobsCache('want');
  state.jobs.delivery = readJobsCache('delivery');
  state.jobs.postage = readJobsCache('postage');
  switchTab('want');
  window.__kilang = state; // debugging/test hook
  setInterval(function () {
    // silent background refresh every 60s
    if (!document.getElementById('upload-overlay').classList.contains('show')) refresh();
  }, 60000);
</script>
