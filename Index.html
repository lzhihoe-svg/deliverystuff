<style>
  :root {
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --orange: #ea580c;
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    /* enough room to scroll the last card's buttons clear of the nav bar */
    padding-bottom: 180px;
    overscroll-behavior-y: contain;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: #0f172a; color: #fff;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 18px; margin-right: auto; }
  .role-btn {
    border: 1px solid rgba(255,255,255,.4); background: none; color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #reset-btn { border-color: #f87171; color: #fca5a5; display: none; }

  /* ---------- bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: #fff; border-top: 1px solid #e2e8f0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; padding: 8px 0 10px;
    font-size: 12px; color: var(--muted); position: relative; cursor: pointer;
  }
  nav button .ico { display: block; font-size: 26px; line-height: 1.2; }
  nav button.active { color: var(--blue); font-weight: 700; }
  nav button .badge {
    position: absolute; top: 2px; right: 22%;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    line-height: 18px; padding: 0 4px; display: none;
  }
  /* Post button lives INSIDE the nav bar so it can never cover card buttons */
  #nav-post { color: var(--blue); font-weight: 800; }
  #nav-post .post-circle {
    display: block; width: 31px; height: 31px; margin: 0 auto; border-radius: 50%;
    background: var(--blue); color: #fff; font-size: 24px; line-height: 30px; font-weight: 700;
  }

  /* ---------- generic ---------- */
  .page { display: none; padding: 14px; max-width: 560px; margin: 0 auto; }
  .page.active { display: block; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 16px; grid-column: 1 / -1; }
  .empty .big { font-size: 52px; display: block; margin-bottom: 10px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 6px; }

  .card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(15,23,42,.08);
    display: flex; flex-direction: column;
  }
  .card .body { padding: 12px 14px; display: flex; flex-direction: column; flex: 1; }
  .card .note { font-size: 16px; margin-bottom: 8px; white-space: pre-wrap; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .spacer { flex: 1; }

  /* ---------- photo carousel (swipe left/right between photos) ---------- */
  .carousel { position: relative; background: #e2e8f0; }
  .car-track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .car-track::-webkit-scrollbar { display: none; }
  .car-slide { flex: 0 0 100%; scroll-snap-align: center; }
  .car-slide img {
    width: 100%; display: block; min-height: 120px; max-height: 340px;
    object-fit: contain; background: #e2e8f0; cursor: pointer;
  }
  .car-dots {
    position: absolute; bottom: 8px; left: 0; right: 0;
    text-align: center; pointer-events: none;
  }
  .car-dots span, .stack-dots span {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(15,23,42,.35); margin: 0 3px;
    border: 1px solid rgba(255,255,255,.8);
  }
  .car-dots span.on, .stack-dots span.on { background: var(--blue); }
  .car-count {
    position: absolute; top: 8px; right: 8px; background: rgba(15,23,42,.7);
    color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px;
    padding: 3px 10px; pointer-events: none;
  }
  .car-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(15,23,42,.55); color: #fff; font-size: 22px; font-weight: 700;
    cursor: pointer; display: none; line-height: 40px;
  }
  .car-btn.prev { left: 8px; }
  .car-btn.next { right: 8px; }
  @media (min-width: 700px) { .carousel:hover .car-btn { display: block; } .car-btn { display: block; } }

  .chip {
    display: inline-block; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 12px; margin-bottom: 8px;
  }
  .chip.lalamove { background: #ffedd5; color: #9a3412; }
  .chip.bus      { background: #dbeafe; color: #1e40af; }
  .chip.pickup   { background: #dcfce7; color: #166534; }
  .chip.old      { background: #fee2e2; color: #991b1b; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px;
    padding: 16px; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
  }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn.blue { background: var(--blue); }
  .btn.gray { background: #94a3b8; }
  .btn.small { padding: 10px; font-size: 15px; border-radius: 10px; }
  .btn:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  /* small outline edit/delete buttons (admin only) */
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button {
    flex: 1; background: #fff; border-radius: 10px; padding: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tools .t-edit { border: 2px solid var(--blue); color: var(--blue); }
  .tools .t-del  { border: 2px solid var(--red); color: var(--red); }
  .tools .t-arch { border: 2px solid #94a3b8; color: #64748b; }

  /* ---------- swipe stack (tab 1) ---------- */
  .stack-outer { max-width: 420px; margin: 0 auto; }
  .stack-wrap { position: relative; height: 58vh; max-height: 480px; margin-bottom: 12px; }
  .swipe-card {
    position: absolute; inset: 0; background: #fff; border-radius: 18px;
    box-shadow: 0 4px 16px rgba(15,23,42,.15); overflow: hidden;
    display: flex; flex-direction: column; touch-action: none; user-select: none;
  }
  .swipe-card img { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #0f172a; pointer-events: none; }
  .swipe-card .foot { padding: 8px 12px; background: #fff; }
  .swipe-card .foot .cap { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stack-dots {
    position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
  }
  .stack-hint {
    position: absolute; top: 26px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none;
  }
  .stamp {
    position: absolute; top: 24px; font-size: 40px; font-weight: 900;
    padding: 6px 18px; border: 5px solid; border-radius: 12px; opacity: 0;
    transform: rotate(-12deg); pointer-events: none;
  }
  .stamp.yes { left: 16px; color: var(--green); border-color: var(--green); }
  .stamp.no  { right: 16px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .swipe-help { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }

  /* ---------- category pills (tab 2) ---------- */
  .pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .pills button {
    border: 2px solid #cbd5e1; background: #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; color: var(--muted);
    white-space: nowrap; cursor: pointer;
  }
  .pills button.active { border-color: var(--blue); background: var(--blue); color: #fff; }

  .proof { display: flex; align-items: center; gap: 10px; background: #f0fdf4; border-radius: 10px; padding: 8px; margin-top: 10px; }
  .proof img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; }
  .proof .txt { font-size: 13px; color: #166534; font-weight: 600; }

  /* ---------- modals (always centered) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .sheet {
    position: relative; background: #fff; width: 100%; max-width: 480px;
    border-radius: 20px; padding: 22px 18px; max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 19px; margin-bottom: 14px; padding-right: 40px; }
  .sheet label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .sheet textarea, .sheet input[type=password] {
    width: 100%; border: 2px solid #cbd5e1; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit;
  }
  .x-close {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: #f1f5f9; color: #475569; font-size: 18px; font-weight: 700;
    cursor: pointer; line-height: 38px;
  }
  .x-close:active { background: #e2e8f0; }

  .photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 2px dashed #94a3b8; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; color: var(--muted);
    background: #f8fafc; cursor: pointer;
  }
  input[type=file] { display: none; }

  /* photo thumbnails in the post/edit form */
  .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .thumb { position: relative; width: 76px; height: 76px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 2px solid #cbd5e1; }
  .thumb .thumb-x {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px;
    border-radius: 50%; border: 2px solid #fff; background: var(--red); color: #fff;
    font-size: 12px; font-weight: 800; cursor: pointer; line-height: 20px; padding: 0;
  }
  .thumb .thumb-n {
    position: absolute; bottom: 2px; left: 2px; background: rgba(15,23,42,.7);
    color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px;
  }

  .choice-row { display: flex; gap: 10px; }
  .choice-row button {
    flex: 1; border: 2px solid #cbd5e1; background: #fff; border-radius: 14px;
    padding: 16px 8px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .choice-row button.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }
  .choice-row .big { display: block; font-size: 34px; margin-bottom: 4px; }

  /* ---------- toast & spinner ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; z-index: 90; display: none; max-width: 90%;
  }
  #spinner {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; background: rgba(255,255,255,.6);
  }
  #spinner .ring {
    width: 54px; height: 54px; border-radius: 50%;
    border: 6px solid #cbd5e1; border-top-color: var(--blue);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70; display: none; align-items: center; justify-content: center; }
  .viewer.show { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; }

  /* ================= DESKTOP ================= */
  @media (min-width: 700px) {
    .page { max-width: 1100px; padding: 20px 24px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    nav {
      left: 50%; right: auto; transform: translateX(-50%);
      width: 480px; bottom: 18px; border-radius: 999px;
      border: 1px solid #e2e8f0; box-shadow: 0 8px 28px rgba(15,23,42,.18);
      overflow: hidden; padding-bottom: 0;
    }
    nav button { padding: 10px 0 12px; }
    .pills button { padding: 10px 22px; }
    .stack-outer { max-width: 440px; }
    body { padding-bottom: 160px; }
  }
  @media (min-width: 1050px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>

<header>
  <h1>🏭 Kilang App</h1>
  <button class="role-btn" id="reset-btn" onclick="askReset()">🔄 Reset</button>
  <button class="role-btn" id="role-btn" onclick="openRoleModal()">👷 Staff</button>
</header>

<!-- ================= TAB 1 : CHECKING (Kilang Want) ================= -->
<div class="page" id="page-want">
  <div id="want-stack-area"></div>
  <div id="want-responded"></div>
</div>

<!-- ================= TAB 2 : DELIVERY (Kilang Packing) ================= -->
<div class="page" id="page-delivery">
  <div class="pills" id="delivery-pills">
    <button data-cat="" class="active">All</button>
    <button data-cat="lalamove">🛵 Lalamove</button>
    <button data-cat="bus">🚌 Bus</button>
    <button data-cat="pickup">🤝 Pickup</button>
  </div>
  <div id="delivery-list"></div>
</div>

<!-- ================= TAB 3 : POSTAGE ================= -->
<div class="page" id="page-postage">
  <div id="postage-list"></div>
</div>

<!-- ================= BOTTOM NAV ================= -->
<nav>
  <button id="nav-want" onclick="switchTab('want')">
    <span class="ico">🧵</span><span class="nav-lbl">Checking</span>
    <span class="badge" id="badge-want"></span>
  </button>
  <button id="nav-delivery" onclick="switchTab('delivery')">
    <span class="ico">🚚</span><span class="nav-lbl">Delivery</span>
    <span class="badge" id="badge-delivery"></span>
  </button>
  <button id="nav-postage" onclick="switchTab('postage')">
    <span class="ico">📦</span><span class="nav-lbl">Postage</span>
    <span class="badge" id="badge-postage"></span>
  </button>
  <button id="nav-post" onclick="openUpload(null)">
    <span class="post-circle">＋</span><span class="nav-lbl">Post</span>
  </button>
</nav>

<!-- ================= ROLE MODAL ================= -->
<div class="overlay" id="role-overlay">
  <div class="sheet" style="text-align:center">
    <button class="x-close" onclick="closeRoleModal()">✕</button>
    <h2 style="padding-right:0">👋 Who are you?</h2>
    <div class="choice-row" style="margin-top:8px">
      <button onclick="chooseStaff()"><span class="big">👷</span>Staff</button>
      <button id="role-admin-btn" onclick="showPin()"><span class="big">👔</span>Admin</button>
    </div>
    <div id="pin-wrap" style="display:none">
      <label style="text-align:left">Admin PIN 🔑</label>
      <input type="password" id="pin-input" inputmode="numeric" placeholder="Enter PIN">
      <div style="margin-top:14px">
        <button class="btn blue" onclick="submitPin()">✅ OK</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= UPLOAD / EDIT MODAL ================= -->
<div class="overlay" id="upload-overlay">
  <div class="sheet">
    <button class="x-close" onclick="closeUpload()">✕</button>
    <h2 id="upload-title"></h2>

    <div id="upload-cat-wrap" style="display:none">
      <label>Delivery method</label>
      <div class="choice-row" id="upload-cats">
        <button data-cat="lalamove" onclick="pickCat(this)"><span class="big">🛵</span>Lalamove</button>
        <button data-cat="bus" onclick="pickCat(this)"><span class="big">🚌</span>Bus</button>
        <button data-cat="pickup" onclick="pickCat(this)"><span class="big">🤝</span>Pickup</button>
      </div>
    </div>

    <label id="photos-label">Photos 📸</label>
    <div class="thumbs" id="upload-thumbs"></div>
    <button class="photo-btn" onclick="document.getElementById('photos-file').click()">📷 Add Photo(s)</button>
    <input type="file" id="photos-file" accept="image/*" multiple onchange="photosPicked(this)">

    <label>Instruction (optional)</label>
    <textarea id="upload-note" rows="2" placeholder="Example: Deliver before 5pm"></textarea>

    <div class="btn-row">
      <button class="btn gray" onclick="closeUpload()">Cancel</button>
      <button class="btn blue" id="btn-submit" onclick="submitUpload()"></button>
    </div>
  </div>
</div>

<!-- ================= CONFIRM MODAL (delete / reset) ================= -->
<div class="overlay" id="confirm-overlay">
  <div class="sheet" style="max-width:360px;text-align:center">
    <button class="x-close" onclick="closeConfirm()">✕</button>
    <h2 id="confirm-msg" style="padding-right:0;font-size:17px;margin-top:6px"></h2>
    <div class="btn-row">
      <button class="btn gray" onclick="closeConfirm()">Cancel</button>
      <button class="btn red" id="confirm-yes" onclick="confirmYes()"></button>
    </div>
  </div>
</div>

<!-- ================= PROOF PHOTO (staff confirm) ================= -->
<input type="file" id="proof-file" accept="image/*" capture="environment" onchange="proofPicked(this)">

<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewer-img"></div>
<div id="toast"></div>
<div id="spinner"><div class="ring"></div></div>

<script>
  // ------------------------------------------------------------ state
  var state = {
    tab: 'want',
    role: localStorage.getItem('kilangRole') || '',
    pin: localStorage.getItem('kilangPin') || '',
    deliveryCat: '',
    jobs: { want: [], delivery: [], postage: [] },
    upload: { photos: [], cat: '' },   // photos: [{b64} for new, {id} for existing]
    editing: null,
    proofJobId: null
  };
  var CAT_LABEL = { lalamove: '🛵 Lalamove', bus: '🚌 Bus', pickup: '🤝 Pickup' };
  var DAY = 24 * 60 * 60 * 1000;
  var MAX_PHOTOS = 6;

  function isAdmin() { return state.role === 'admin'; }

  // ------------------------------------------------------------ images
  // Photos are served THROUGH the app (base64 via getImagesData), so they
  // show on every device — no dependency on Drive link-sharing.
  var imgCache = {};
  var imgFetching = {};
  var PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">' +
    '<rect width="400" height="300" fill="#e2e8f0"/>' +
    '<text x="200" y="160" font-size="48" text-anchor="middle">⏳</text></svg>');

  function imgTag(id, style, extra) {
    return '<img data-img="' + id + '" src="' + (imgCache[id] || PLACEHOLDER) + '" ' +
      (style ? 'style="' + style + '" ' : '') + (extra || '') + '>';
  }

  function loadImages() {
    var want = [];
    var els = document.querySelectorAll('img[data-img]');
    for (var i = 0; i < els.length; i++) {
      var id = els[i].getAttribute('data-img');
      if (imgCache[id]) {
        if (els[i].getAttribute('src') !== imgCache[id]) els[i].src = imgCache[id];
      } else if (!imgFetching[id] && want.indexOf(id) < 0) {
        want.push(id);
      }
    }
    if (!want.length) return;
    var batch = want.slice(0, 6);
    batch.forEach(function (id) { imgFetching[id] = true; });
    google.script.run
      .withSuccessHandler(function (map) {
        for (var k in map) { if (map[k]) imgCache[k] = map[k]; }
        batch.forEach(function (id) { delete imgFetching[id]; });
        var els2 = document.querySelectorAll('img[data-img]');
        for (var i = 0; i < els2.length; i++) {
          var id2 = els2[i].getAttribute('data-img');
          if (imgCache[id2] && els2[i].getAttribute('src') !== imgCache[id2]) els2[i].src = imgCache[id2];
        }
        loadImages();
      })
      .withFailureHandler(function () {
        batch.forEach(function (id) { delete imgFetching[id]; });
      })
      .getImagesData(batch);
  }

  function seedImage(id, base64jpeg) {
    if (id && base64jpeg) imgCache[id] = 'data:image/jpeg;base64,' + base64jpeg;
  }

  function viewPhoto(id) {
    var v = document.getElementById('viewer-img');
    v.setAttribute('data-img', id);
    v.src = imgCache[id] || PLACEHOLDER;
    document.getElementById('viewer').classList.add('show');
    loadImages();
  }

  // ------------------------------------------------------------ photo carousel
  function dotsHtml(n, cls) {
    if (n < 2) return '';
    var s = '<div class="' + cls + '">';
    for (var i = 0; i < n; i++) s += '<span class="' + (i === 0 ? 'on' : '') + '"></span>';
    return s + '</div>';
  }

  /** Swipeable photo strip for a job card (tabs 2/3 + status list). */
  function carouselHtml(ids) {
    if (ids.length === 1) {
      return '<div class="carousel">' +
        imgTag(ids[0], 'width:100%;display:block;min-height:120px;max-height:340px;object-fit:contain;cursor:pointer',
          'onclick="viewPhoto(\'' + ids[0] + '\')"') + '</div>';
    }
    var s = '<div class="carousel"><div class="car-track">';
    for (var i = 0; i < ids.length; i++) {
      s += '<div class="car-slide">' + imgTag(ids[i], '', 'onclick="viewPhoto(\'' + ids[i] + '\')"') + '</div>';
    }
    s += '</div>';
    s += '<button class="car-btn prev" onclick="carMove(this,-1)">‹</button>';
    s += '<button class="car-btn next" onclick="carMove(this,1)">›</button>';
    s += '<div class="car-count">' + ids.length + ' 📷</div>';
    s += dotsHtml(ids.length, 'car-dots');
    return s + '</div>';
  }

  function carMove(btn, dir) {
    var track = btn.parentNode.querySelector('.car-track');
    track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
  }

  function attachCarousels() {
    document.querySelectorAll('.car-track').forEach(function (tr) {
      if (tr._wired) return;
      tr._wired = true;
      tr.addEventListener('scroll', function () {
        clearTimeout(tr._t);
        tr._t = setTimeout(function () {
          var idx = Math.round(tr.scrollLeft / tr.clientWidth);
          var dots = tr.parentNode.querySelectorAll('.car-dots span');
          dots.forEach(function (d, i) { d.className = i === idx ? 'on' : ''; });
        }, 80);
      });
    });
  }

  // ------------------------------------------------------------ helpers
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function timeAgo(ms) {
    if (!ms) return '';
    var d = Date.now() - ms;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + ' min ago';
    if (d < DAY) return Math.floor(d / 3600000) + ' hr ago';
    return Math.floor(d / DAY) + ' days ago';
  }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(el._h); el._h = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }
  function busy(on) { document.getElementById('spinner').style.display = on ? 'flex' : 'none'; }
  function findJob(id) {
    var list = state.jobs[state.tab];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // ------------------------------------------------------------ roles
  function renderRoleBtn() {
    document.getElementById('role-btn').textContent = isAdmin() ? '👔 Admin' : '👷 Staff';
    document.getElementById('reset-btn').style.display = isAdmin() ? 'block' : 'none';
  }
  function openRoleModal() {
    document.getElementById('pin-wrap').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('role-overlay').classList.add('show');
  }
  function closeRoleModal() {
    if (!state.role) setRole('staff', '');
    else document.getElementById('role-overlay').classList.remove('show');
  }
  function chooseStaff() { setRole('staff', ''); }
  function showPin() {
    document.getElementById('pin-wrap').style.display = 'block';
    document.getElementById('pin-input').focus();
  }
  function submitPin() {
    var p = document.getElementById('pin-input').value.trim();
    if (!p) { toast('Enter the PIN 🔑'); return; }
    busy(true);
    google.script.run
      .withSuccessHandler(function (ok) {
        busy(false);
        if (ok) { setRole('admin', p); toast('👔 Admin mode on'); }
        else { toast('❌ Wrong PIN'); }
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
      .checkPin(p);
  }
  function setRole(role, pin) {
    state.role = role; state.pin = pin;
    localStorage.setItem('kilangRole', role);
    localStorage.setItem('kilangPin', pin);
    document.getElementById('role-overlay').classList.remove('show');
    renderRoleBtn(); renderAll();
  }

  // ------------------------------------------------------------ tabs
  function switchTab(tab) {
    state.tab = tab;
    ['want', 'delivery', 'postage'].forEach(function (x) {
      document.getElementById('page-' + x).classList.toggle('active', x === tab);
      document.getElementById('nav-' + x).classList.toggle('active', x === tab);
    });
    refresh(tab);
  }

  function refresh(tab) {
    google.script.run
      .withSuccessHandler(function (jobs) { state.jobs[tab] = jobs; renderAll(); })
      .withFailureHandler(function (e) { toast('⚠️ ' + e.message); })
      .getJobs(tab);
    google.script.run.withSuccessHandler(renderBadges).getCounts();
  }
  function renderBadges(c) {
    ['want', 'delivery', 'postage'].forEach(function (x) {
      var b = document.getElementById('badge-' + x);
      b.style.display = c[x] > 0 ? 'block' : 'none';
      b.textContent = c[x];
    });
  }

  function renderAll() {
    renderWant(); renderDelivery(); renderPostage();
    attachCarousels();
    loadImages();
  }

  // admin-only edit/delete/(hide) button row
  function toolBtns(j, withArchive) {
    if (!isAdmin()) return '';
    var html = '<div class="tools">' +
      '<button class="t-edit" onclick="openUpload(\'' + j.id + '\')">✏️ Edit</button>' +
      '<button class="t-del" onclick="removeJob(\'' + j.id + '\')">🗑️ Delete</button>';
    if (withArchive) {
      html += '<button class="t-arch" onclick="markJob(\'' + j.id + '\',\'archived\')">🗄️ Hide</button>';
    }
    return html + '</div>';
  }

  // ------------------------------------------------------------ TAB 1: checking (swipe)
  function renderWant() {
    var jobs = state.jobs.want;
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var responded = jobs.filter(function (j) { return j.status === 'got' || j.status === 'notseen'; });
    var area = document.getElementById('want-stack-area');

    if (pending.length === 0) {
      area.innerHTML = '<div class="empty"><span class="big">🎉</span>No new jobsheets!</div>';
    } else {
      var html = '<div class="stack-outer">';
      html += '<div class="swipe-help">👈 ❌ Not seen &nbsp;|&nbsp; ❤️ Got it 👉</div>';
      html += '<div class="stack-wrap" id="stack">';
      var show = pending.slice(0, 3).reverse();   // last in DOM = top of stack
      for (var i = 0; i < show.length; i++) {
        var j = show[i];
        var top = (i === show.length - 1);
        var multi = j.photoIds.length > 1;
        html += '<div class="swipe-card" data-id="' + j.id + '" data-photos="' + j.photoIds.join(',') + '" data-idx="0" ' +
          (top ? 'id="topcard"' : '') + '>' +
          imgTag(j.photoIds[0]) +
          (multi ? dotsHtml(j.photoIds.length, 'stack-dots') +
                   '<div class="stack-hint">👆 Tap left / right side for more photos</div>' : '') +
          '<div class="foot">' +
            '<div class="cap">📄 ' + (esc(j.note) || 'Jobsheet') +
            (multi ? ' · ' + j.photoIds.length + ' 📷' : '') +
            ' · ' + timeAgo(j.createdAt) + ' · ' + pending.length + ' left</div>' +
            toolBtns(j, false) +
          '</div>' +
          '<div class="stamp yes">❤️</div><div class="stamp no">❌</div>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="btn-row">' +
        '<button class="btn red" onclick="swipeAction(\'notseen\')">❌ Not Seen</button>' +
        '<button class="btn green" onclick="swipeAction(\'got\')">❤️ Got It</button></div>';
      html += '</div>';
      area.innerHTML = html;
      attachSwipe();
    }

    var r = document.getElementById('want-responded');
    if (responded.length === 0) { r.innerHTML = ''; return; }
    var html2 = '<div class="section-title">📋 Jobsheet Status</div><div class="grid">';
    responded.forEach(function (j) {
      var got = j.status === 'got';
      html2 += '<div class="card">' + carouselHtml(j.photoIds) +
        '<div class="body">' +
        '<div class="note" style="font-size:15px">' + (got ? '❤️ Got it' : '❌ Not seen yet') + '</div>' +
        '<div class="meta">' + timeAgo(j.doneAt) + '</div>' +
        (!got ? '<button class="btn green small" style="margin-top:8px" onclick="markJob(\'' + j.id + '\',\'got\')">❤️ Found it</button>' : '') +
        '<div class="spacer"></div>' +
        toolBtns(j, true) +
        '</div></div>';
    });
    r.innerHTML = html2 + '</div>';
  }

  /** Tap left/right side of the top swipe card to flip between its photos. */
  function stackTap(card, clientX) {
    var ids = (card.getAttribute('data-photos') || '').split(',');
    if (ids.length < 2) return;
    var idx = parseInt(card.getAttribute('data-idx') || '0', 10);
    var rect = card.getBoundingClientRect();
    var dir = (clientX - rect.left) > rect.width / 2 ? 1 : -1;
    idx = (idx + dir + ids.length) % ids.length;
    card.setAttribute('data-idx', idx);
    var img = card.querySelector('img[data-img]');
    img.setAttribute('data-img', ids[idx]);
    img.src = imgCache[ids[idx]] || PLACEHOLDER;
    var dots = card.querySelectorAll('.stack-dots span');
    dots.forEach(function (d, i) { d.className = i === idx ? 'on' : ''; });
    loadImages();
  }

  function attachSwipe() {
    var card = document.getElementById('topcard');
    if (!card) return;
    var startX = 0, dx = 0, dragging = false;
    var yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');

    function move(x) {
      dx = x - startX;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
      yes.style.opacity = dx > 30 ? Math.min(1, dx / 110) : 0;
      no.style.opacity = dx < -30 ? Math.min(1, -dx / 110) : 0;
    }
    function end() {
      if (!dragging) return;
      dragging = false;
      if (dx > 110) flyOut(card, 1, 'got');
      else if (dx < -110) flyOut(card, -1, 'notseen');
      else {
        card.style.transition = 'transform .2s'; card.style.transform = '';
        yes.style.opacity = 0; no.style.opacity = 0;
        setTimeout(function () { card.style.transition = ''; }, 220);
        if (Math.abs(dx) < 8) stackTap(card, startX); // it was a tap, not a swipe
      }
    }
    card.addEventListener('touchstart', function (e) {
      if (e.target.closest('button')) return;
      dragging = true; dx = 0; startX = e.touches[0].clientX;
    }, { passive: true });
    card.addEventListener('touchmove', function (e) { if (dragging) move(e.touches[0].clientX); }, { passive: true });
    card.addEventListener('touchend', end);
    card.addEventListener('mousedown', function (e) {
      if (e.target.closest('button')) return;
      dragging = true; dx = 0; startX = e.clientX; e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) { if (dragging) move(e.clientX); });
    window.addEventListener('mouseup', end);
  }

  function flyOut(card, dir, status) {
    var id = card.getAttribute('data-id');
    card.style.transition = 'transform .3s, opacity .3s';
    card.style.transform = 'translateX(' + (dir * window.innerWidth) + 'px) rotate(' + (dir * 30) + 'deg)';
    card.style.opacity = '0';
    setTimeout(function () { markJob(id, status); }, 250);
  }

  function swipeAction(status) {
    var card = document.getElementById('topcard');
    if (card) flyOut(card, status === 'got' ? 1 : -1, status);
  }

  // ------------------------------------------------------------ TAB 2: delivery
  document.getElementById('delivery-pills').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.deliveryCat = b.getAttribute('data-cat');
    this.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    renderDelivery(); attachCarousels(); loadImages();
  });

  function renderDelivery() {
    var jobs = state.jobs.delivery.filter(function (j) {
      return !state.deliveryCat || j.category === state.deliveryCat;
    });
    document.getElementById('delivery-list').innerHTML = renderJobList(jobs);
  }

  // ------------------------------------------------------------ TAB 3: postage
  function renderPostage() {
    document.getElementById('postage-list').innerHTML = renderJobList(state.jobs.postage);
  }

  // shared card list for tabs 2 & 3
  function renderJobList(jobs) {
    var pending = jobs.filter(function (j) { return j.status === 'pending'; });
    var done = jobs.filter(function (j) { return j.status === 'done'; });
    var html = '';

    if (pending.length === 0 && done.length === 0) {
      return '<div class="empty"><span class="big">📭</span>Nothing here yet.</div>';
    }

    if (pending.length) {
      html += '<div class="section-title">⏳ To Do (' + pending.length + ')</div><div class="grid">';
      pending.forEach(function (j) { html += jobCard(j, false); });
      html += '</div>';
    }
    if (done.length) {
      html += '<div class="section-title">✅ Done (' + done.length + ')</div><div class="grid">';
      done.forEach(function (j) { html += jobCard(j, true); });
      html += '</div>';
    }
    return html;
  }

  function jobCard(j, isDone) {
    var old = !isDone && (Date.now() - j.createdAt > DAY);
    var html = '<div class="card">' + carouselHtml(j.photoIds);

    html += '<div class="body">';
    if (j.category) html += '<span class="chip ' + j.category + '">' + CAT_LABEL[j.category] + '</span> ';
    if (old) html += '<span class="chip old">⚠️ Over 1 day!</span>';
    if (j.note) html += '<div class="note">📢 ' + esc(j.note) + '</div>';
    html += '<div class="meta">Posted ' + timeAgo(j.createdAt) + '</div>';

    if (isDone) {
      html += '<div class="proof">' +
        (j.proofPhotoId ? imgTag(j.proofPhotoId, '', 'onclick="viewPhoto(\'' + j.proofPhotoId + '\')"') : '') +
        '<div class="txt">✅ Done · ' + timeAgo(j.doneAt) + '</div></div>';
      html += '<div class="spacer"></div>' + toolBtns(j, true);
    } else {
      html += '<div class="spacer"></div>';
      html += '<button class="btn green" style="margin-top:10px" onclick="startProof(\'' + j.id + '\')">📸 Done! Take Proof Photo</button>';
      html += toolBtns(j, false);
    }
    html += '</div></div>';
    return html;
  }

  // ------------------------------------------------------------ status updates / delete / reset
  function bgFail(e) { toast('⚠️ ' + e.message); refresh(state.tab); }

  function updateBadgeLocal() {
    var n = state.jobs[state.tab].filter(function (j) { return j.status === 'pending'; }).length;
    var b = document.getElementById('badge-' + state.tab);
    b.style.display = n > 0 ? 'block' : 'none';
    b.textContent = n;
  }

  function markJob(id, status) {
    var j = findJob(id);
    if (j) {
      if (status === 'archived') {
        state.jobs[state.tab] = state.jobs[state.tab].filter(function (x) { return x.id !== id; });
      } else {
        j.status = status; j.doneAt = Date.now();
      }
      renderAll(); updateBadgeLocal();
    }
    if (status === 'got') toast('❤️ Great!');
    if (status === 'notseen') toast('❌ Office will follow up.');
    if (status === 'archived') toast('🗄️ Hidden.');
    google.script.run.withFailureHandler(bgFail).updateStatus(id, status, null, state.pin);
  }

  // generic confirm modal — window.confirm() can be silently blocked
  // inside the Apps Script sandbox iframe
  var confirmCb = null;
  function askConfirm(msg, yesLabel, cb) {
    confirmCb = cb;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-yes').textContent = yesLabel;
    document.getElementById('confirm-overlay').classList.add('show');
  }
  function closeConfirm() {
    confirmCb = null;
    document.getElementById('confirm-overlay').classList.remove('show');
  }
  function confirmYes() {
    var cb = confirmCb;
    closeConfirm();
    if (cb) cb();
  }

  function removeJob(id) {
    askConfirm('Delete this job? Cannot undo!', '🗑️ Yes, Delete', function () {
      state.jobs[state.tab] = state.jobs[state.tab].filter(function (j) { return j.id !== id; });
      renderAll(); updateBadgeLocal();
      toast('🗑️ Deleted.');
      google.script.run.withFailureHandler(bgFail).deleteJob(id, state.pin);
    });
  }

  function askReset() {
    askConfirm('Start a new day? ALL jobs in ALL tabs will be cleared. Records stay safe in the Google Sheet.',
      '🔄 Yes, Reset', function () {
        state.jobs = { want: [], delivery: [], postage: [] };
        renderAll();
        renderBadges({ want: 0, delivery: 0, postage: 0 });
        toast('🔄 Fresh day! All tabs cleared.');
        google.script.run
          .withFailureHandler(function (e) { toast('⚠️ ' + e.message); refresh(state.tab); })
          .resetAll(state.pin);
      });
  }

  function startProof(jobId) {
    state.proofJobId = jobId;
    document.getElementById('proof-file').click();
  }
  function proofPicked(input) {
    if (!input.files || !input.files[0]) return;
    var id = state.proofJobId;
    busy(true); // real upload — keep the spinner while the photo transfers
    compressImage(input.files[0], function (b64) {
      google.script.run
        .withSuccessHandler(function (res) {
          var j = findJob(id);
          if (j) { j.status = 'done'; j.doneAt = res.doneAt; j.proofPhotoId = res.proofPhotoId; }
          seedImage(res.proofPhotoId, b64);
          busy(false); renderAll(); updateBadgeLocal();
          toast('✅ Done! Thank you 🙏');
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); refresh(state.tab); })
        .updateStatus(id, 'done', b64, null);
    });
    input.value = '';
  }

  // ------------------------------------------------------------ upload & edit modal
  function openUpload(editId) {
    var job = editId ? findJob(editId) : null;
    if (editId && !job) return;
    if (job && !isAdmin()) { toast('Admin only'); return; }
    state.editing = job;
    state.upload = {
      photos: job ? job.photoIds.map(function (id) { return { id: id }; }) : [],
      cat: job ? (job.category || '') : ''
    };

    var titles = {
      want: '🧵 Post New Jobsheet',
      delivery: '🚚 Post Delivery Instruction',
      postage: '📦 Post Airway Bill + Jobsheet'
    };
    document.getElementById('upload-title').textContent = job ? '✏️ Edit Job' : titles[state.tab];
    document.getElementById('upload-cat-wrap').style.display = state.tab === 'delivery' ? 'block' : 'none';
    document.getElementById('photos-label').textContent =
      state.tab === 'postage' ? 'Photos 📸 (jobsheet + airway bill)' : 'Photos 📸';
    document.getElementById('btn-submit').textContent = job ? '💾 Save' : '📤 Post';
    document.getElementById('upload-note').value = job ? (job.note || '') : '';

    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', !!job && b.getAttribute('data-cat') === job.category);
    });

    renderUploadThumbs();
    document.getElementById('upload-overlay').classList.add('show');
    loadImages();
  }
  function closeUpload() { document.getElementById('upload-overlay').classList.remove('show'); }

  function pickCat(btn) {
    state.upload.cat = btn.getAttribute('data-cat');
    document.getElementById('upload-cats').querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }

  function renderUploadThumbs() {
    var html = '';
    state.upload.photos.forEach(function (p, i) {
      html += '<div class="thumb">' +
        (p.b64 ? '<img src="data:image/jpeg;base64,' + p.b64 + '">' : imgTag(p.id)) +
        '<button class="thumb-x" onclick="removeUploadPhoto(' + i + ')">✕</button>' +
        '<span class="thumb-n">' + (i + 1) + '</span>' +
        '</div>';
    });
    document.getElementById('upload-thumbs').innerHTML = html;
  }
  function removeUploadPhoto(i) {
    state.upload.photos.splice(i, 1);
    renderUploadThumbs(); loadImages();
  }

  function photosPicked(input) {
    if (!input.files || !input.files.length) return;
    var files = Array.prototype.slice.call(input.files);
    input.value = '';
    if (state.upload.photos.length + files.length > MAX_PHOTOS) {
      toast('Max ' + MAX_PHOTOS + ' photos per job');
      files = files.slice(0, MAX_PHOTOS - state.upload.photos.length);
      if (!files.length) return;
    }
    busy(true);
    var remaining = files.length;
    files.forEach(function (f) {
      compressImage(f, function (b64) {
        state.upload.photos.push({ b64: b64 });
        remaining--;
        if (remaining === 0) { busy(false); renderUploadThumbs(); loadImages(); }
      });
    });
  }

  function submitUpload() {
    var note = document.getElementById('upload-note').value.trim();
    var photos = state.upload.photos;

    if (!photos.length) { toast('Please add a photo first 📸'); return; }
    if (state.tab === 'delivery' && !state.upload.cat) { toast('Choose delivery method first 🛵🚌🤝'); return; }
    if (state.tab === 'postage' && photos.length < 2 && !state.editing) {
      toast('Need at least 2 photos: jobsheet + airway bill 📸'); return;
    }

    if (state.editing) {
      busy(true); // photos may need uploading — keep spinner during transfer
      var spec = photos.map(function (p) { return p.b64 ? { b64: p.b64 } : { id: p.id }; });
      google.script.run
        .withSuccessHandler(function (job) {
          for (var i = 0; i < spec.length; i++) {
            if (spec[i].b64) seedImage(job.photoIds[i], spec[i].b64);
          }
          var list = state.jobs[state.tab];
          for (var k = 0; k < list.length; k++) if (list[k].id === job.id) { list[k] = job; break; }
          busy(false); closeUpload(); renderAll(); updateBadgeLocal();
          toast('💾 Saved!');
        })
        .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
        .editJob(state.editing.id, {
          note: note,
          category: state.tab === 'delivery' ? state.upload.cat : (state.editing.category || ''),
          photos: spec
        }, state.pin);
      return;
    }

    var b64s = photos.map(function (p) { return p.b64; });
    busy(true); // real upload — keep the spinner while photos transfer
    google.script.run
      .withSuccessHandler(function (job) {
        for (var i = 0; i < b64s.length; i++) seedImage(job.photoIds[i], b64s[i]);
        state.jobs[state.tab].unshift(job);
        busy(false); closeUpload(); renderAll(); updateBadgeLocal();
        toast('📤 Posted!');
      })
      .withFailureHandler(function (e) { busy(false); toast('⚠️ ' + e.message); })
      .addJob({
        tab: state.tab,
        category: state.upload.cat,
        note: note,
        photos: b64s
      });
  }

  // close any modal by clicking/tapping the dark backdrop
  ['upload-overlay', 'role-overlay', 'confirm-overlay'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      if (e.target !== this) return;
      if (id === 'role-overlay') closeRoleModal();
      else if (id === 'confirm-overlay') closeConfirm();
      else closeUpload();
    });
  });

  // ------------------------------------------------------------ image compression
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX = 1280;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.8);
        cb(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ------------------------------------------------------------ boot
  renderRoleBtn();
  if (state.role !== 'admin' && state.role !== 'staff') {
    document.getElementById('role-overlay').classList.add('show');
  }
  switchTab('want');
  window.__kilang = state; // debugging/test hook
  setInterval(function () {
    // silent background refresh every 60s
    if (!document.getElementById('upload-overlay').classList.contains('show')) refresh(state.tab);
  }, 60000);
</script>
