<style>
  :root {
    /* Lime green theme */
    --green: #65a30d;        /* success / go actions (lime-600) */
    --red: #dc2626;          /* destructive actions stay red */
    --blue: #4d7c0f;         /* primary accent (lime-700, readable on white) */
    --lime: #84cc16;         /* bright lime highlights */
    --lime-soft: #ecfccb;    /* pale lime fills */
    --header: #1f2b13;       /* deep olive header */
    --bg: #f4f9ea;           /* soft lime-tinted background */
    --card: #ffffff;
    --ink: #1a2408;
    --muted: #66735a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* Scrolling happens inside #scroller, NOT on the page itself.
     Apps Script serves this page inside an iframe, and iPhones/iPads
     scroll iframe documents badly (sticky/stuck feeling). An inner
     scroll container with momentum scrolling fixes that. */
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  #scroller {
    position: fixed; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    /* room to scroll the last card's buttons clear of the nav bar */
    padding-bottom: 180px;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--header); color: #fff;
    border-bottom: 3px solid var(--lime);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin-right: auto; display: flex; align-items: center; gap: 8px; letter-spacing: .5px; }
  header h1 .dot { color: var(--lime); }
  header h1 .logo { width: 27px; height: 27px; flex: 0 0 auto; }
  #refresh-btn { padding: 6px 12px; border-color: var(--lime); color: var(--lime-soft); }
  #sync-row {
    flex-basis: 100%; display: none; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--lime); padding-top: 6px;
  }
  .role-btn {
    border: 1px solid rgba(255,255,255,.4); background: none; color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #reset-btn { border-color: #fbbf24; color: #fde68a; display: none; }
  #cleardone-btn { border-color: #86efac; color: #dcfce7; display: none; }

  /* ---------- bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; background: #fff; border-top: 1px solid #e2e8f0;
    box-shadow: 0 -2px 12px rgba(15,23,42,.06);
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* Icon stacked ABOVE the label, and NOTHING changes size on tap (only
     colors), so the icons never jump out of position when you click. */
  nav button {
    flex: 1; border: 0; background: none; padding: 7px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; font-weight: 700; color: var(--muted);
    position: relative; cursor: pointer; transition: color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  nav button .ico {
    display: block; font-size: 23px; line-height: 30px; height: 30px;
    padding: 0 17px; border-radius: 999px;
    background: transparent; transition: background .15s;
  }
  .nav-lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .2px; }
  nav button.active { color: var(--blue); }
  nav button.active .ico { background: var(--lime-soft); }
  nav button .badge {
    position: absolute; top: 3px; left: 50%; margin-left: 10px;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    line-height: 18px; padding: 0 4px; display: none;
    box-shadow: 0 1px 3px rgba(15,23,42,.25);
  }
  #nav-post { color: var(--blue); }
  #nav-post .post-circle {
    display: block; width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--lime), var(--green));
    color: #fff; font-size: 22px; line-height: 29px; font-weight: 700; text-align: center;
    box-shadow: 0 2px 6px rgba(101,163,13,.4);
  }

  /* ---------- generic ---------- */
  .page { display: none; padding: 14px; max-width: 560px; margin: 0 auto; }
  .page.active { display: block; }
  .section-title {
    font-size: 13px; font-weight: 800; color: var(--blue);
    text-transform: uppercase; letter-spacing: .5px; margin: 20px 0 10px;
  }
  .empty { text-align: center; color: var(--muted); padding: 44px 10px; font-size: 17px; font-weight: 600; grid-column: 1 / -1; }
  .empty .big { font-size: 56px; display: block; margin-bottom: 12px; }
  .empty .hint {
    display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 700;
    color: var(--blue); background: var(--lime-soft); border-radius: 999px; padding: 8px 16px;
  }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 6px; }

  .card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(15,23,42,.08);
    display: flex; flex-direction: column;
    /* skip rendering offscreen cards — smoother scrolling on long lists */
    content-visibility: auto;
    contain-intrinsic-size: 420px;
  }
  .card .body { padding: 12px 14px; display: flex; flex-direction: column; flex: 1; }
  .card .note { font-size: 16px; margin-bottom: 8px; white-space: pre-wrap; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .spacer { flex: 1; }

  /* ---------- photo carousel (swipe left/right between photos) ---------- */
  .carousel { position: relative; background: #e2e8f0; }
  .car-track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .car-track::-webkit-scrollbar { display: none; }
  .car-slide { flex: 0 0 100%; scroll-snap-align: center; }
  .car-slide img, .carousel > img {
    width: 100%; display: block; min-height: 120px; max-height: 340px;
    object-fit: contain; background: #e2e8f0; cursor: pointer;
  }
  .car-dots {
    position: absolute; bottom: 8px; left: 0; right: 0;
    text-align: center; pointer-events: none;
  }
  .car-dots span, .stack-dots span {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(15,23,42,.35); margin: 0 3px;
    border: 1px solid rgba(255,255,255,.8);
  }
  .car-dots span.on, .stack-dots span.on { background: var(--blue); }
  .car-count {
    position: absolute; top: 8px; right: 8px; background: rgba(31,43,19,.7);
    color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px;
    padding: 3px 10px; pointer-events: none;
  }
  .car-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(31,43,19,.55); color: #fff; font-size: 22px; font-weight: 700;
    cursor: pointer; display: none; line-height: 40px;
  }
  .car-btn.prev { left: 8px; }
  .car-btn.next { right: 8px; }
  @media (min-width: 700px) { .car-btn { display: block; } }

  .chip {
    display: inline-block; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 12px; margin-bottom: 8px;
  }
  .chip.lalamove { background: #ffedd5; color: #9a3412; }
  .chip.bus      { background: #dbeafe; color: #1e40af; }
  .chip.pickup   { background: #dcfce7; color: #166534; }
  .chip.old      { background: #fee2e2; color: #991b1b; }
  .chip.up       { background: #fef9c3; color: #854d0e; }
  .chip.pin      { background: #fef3c7; color: #b45309; }
  .chip.due      { background: var(--lime-soft); color: var(--blue); }
  .chip.soon     { background: #fef3c7; color: #92400e; }
  .chip.late     { background: #fee2e2; color: #991b1b; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px;
    padding: 16px; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff;
  }
  .btn.green { background: linear-gradient(135deg, var(--lime), var(--green)); box-shadow: 0 2px 8px rgba(101,163,13,.35); }
  .btn.red { background: var(--red); }
  .btn.blue { background: linear-gradient(135deg, var(--green), var(--blue)); box-shadow: 0 2px 8px rgba(77,124,15,.35); }
  .btn.gray { background: #9aa78e; }
  .btn.small { padding: 10px; font-size: 15px; border-radius: 10px; }
  .btn:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  /* small outline edit/delete buttons (admin only) */
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button {
    flex: 1; background: #fff; border-radius: 10px; padding: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tools .t-edit { border: 2px solid var(--blue); color: var(--blue); }
  .tools .t-del  { border: 2px solid var(--red); color: var(--red); }
  .tools .t-arch { border: 2px solid #94a3b8; color: #64748b; }
  /* proof photo tools — for EVERYONE (staff fix their own proof mistakes) */
  .tools .t-reproof  { border: 2px solid var(--blue); color: var(--blue); }
  .tools .t-delproof { border: 2px solid var(--red); color: var(--red); }

  /* undo bar after a swipe — fix a wrong swipe with one tap */
  .undo-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; border: 1.5px solid var(--lime); border-radius: 12px;
    padding: 8px 12px; margin-bottom: 12px;
    font-size: 14px; font-weight: 700; color: var(--blue);
    box-shadow: 0 1px 4px rgba(15,23,42,.08);
  }
  .undo-bar button {
    border: 0; background: linear-gradient(135deg, var(--lime), var(--green));
    color: #fff; border-radius: 999px; padding: 7px 16px;
    font-size: 14px; font-weight: 800; cursor: pointer;
  }

  /* small, friendly Push Up (ask again) button on Checking status cards */
  .ask-btn {
    display: block; width: 100%; margin-top: 8px;
    background: #fff; border: 2px solid var(--green); color: var(--blue);
    border-radius: 10px; padding: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .ask-btn:active { background: var(--lime-soft); }

  /* ---------- swipe stack (tab 1) ---------- */
  .stack-outer { max-width: 420px; margin: 0 auto; }
  .stack-wrap { position: relative; height: 58vh; max-height: 480px; margin-bottom: 12px; }
  .swipe-card {
    position: absolute; inset: 0; background: #fff; border-radius: 18px;
    box-shadow: 0 4px 16px rgba(15,23,42,.15); overflow: hidden;
    display: flex; flex-direction: column;
    /* pan-y: the browser keeps vertical scrolling; we only take over
       when the finger clearly moves horizontally (see attachSwipe) */
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
  }
  .swipe-card img { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: var(--header); pointer-events: none; }
  .swipe-card .foot { padding: 8px 12px; background: #fff; }
  .swipe-card .foot .cap { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stack-dots { position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none; }
  .stack-hint {
    position: absolute; top: 26px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none;
  }
  .stamp {
    position: absolute; top: 24px; font-size: 40px; font-weight: 900;
    padding: 6px 18px; border: 5px solid; border-radius: 12px; opacity: 0;
    transform: rotate(-12deg); pointer-events: none;
  }
  .stamp.yes { left: 16px; color: var(--green); border-color: var(--green); }
  .stamp.no  { right: 16px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .swipe-help {
    text-align: center; color: var(--blue); font-size: 13px; font-weight: 700;
    background: var(--lime-soft); border-radius: 999px; padding: 8px 12px; margin-bottom: 10px;
  }

  /* ---------- category pills (tab 2) ---------- */
  .pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .pills button {
    border: 2px solid #d3dcc3; background: #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; color: var(--muted);
    white-space: nowrap; cursor: pointer; transition: all .15s;
  }
  .pills button.active { border-color: var(--blue); background: var(--blue); color: #fff; }

  .proof { display: flex; align-items: center; gap: 10px; background: #f7fee7; border: 1px solid var(--lime-soft); border-radius: 10px; padding: 8px; margin-top: 10px; }
  .proof img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; }
  .proof .txt { font-size: 13px; color: #3f6212; font-weight: 700; }

  /* ---------- modals (always centered) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(26,36,8,.55); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .sheet {
    position: relative; background: #fff; width: 100%; max-width: 480px;
    border-radius: 20px; padding: 22px 18px; max-height: 92vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .sheet h2 { font-size: 19px; margin-bottom: 14px; padding-right: 40px; }
  .sheet label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .sheet textarea, .sheet input[type=password], .sheet input[type=time] {
    width: 100%; border: 2px solid #d3dcc3; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit; outline: none; background: #fff;
  }
  .sheet textarea:focus, .sheet input[type=password]:focus, .sheet input[type=time]:focus { border-color: var(--lime); }
  .x-close {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: #f1f5f9; color: #475569; font-size: 18px; font-weight: 700;
    cursor: pointer; line-height: 38px;
  }
  .x-close:active { background: #e2e8f0; }

  .photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 2px dashed var(--green); border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; color: var(--blue);
    background: var(--lime-soft); cursor: pointer;
  }
  .photo-btn:active { transform: scale(.98); }
  input[type=file] { display: none; }

  /* bigger previews so admin can confirm the right photo, with ◀ ▶ reorder */
  .thumbs { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .thumb-wrap { width: 116px; }
  .thumb { position: relative; width: 116px; height: 116px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 2px solid var(--green); }
  .thumb .thumb-x {
    position: absolute; top: -8px; right: -8px; width: 26px; height: 26px;
    border-radius: 50%; border: 2px solid #fff; background: var(--red); color: #fff;
    font-size: 13px; font-weight: 800; cursor: pointer; line-height: 22px; padding: 0;
  }
  .thumb .thumb-n {
    position: absolute; bottom: 4px; left: 4px; background: rgba(31,43,19,.75);
    color: #fff; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 7px;
  }
  .thumb-arrows { display: flex; gap: 4px; margin-top: 5px; }
  .thumb-arrows button {
    flex: 1; border: 2px solid #d3dcc3; background: #fff; border-radius: 8px;
    padding: 5px 0; font-size: 14px; font-weight: 800; color: var(--blue); cursor: pointer;
  }
  .thumb-arrows button:active { background: var(--lime-soft); }
  /* move a photo to the other postage group (wrong upload fix) */
  .thumb-move {
    display: block; width: 100%; margin-top: 4px;
    border: 2px solid #d97706; color: #b45309; background: #fff;
    border-radius: 8px; padding: 4px 0; font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .thumb-move:active { background: #fef3c7; }

  /* postage: Jobsheet mini-carousel | Waybill mini-carousel, side by side */
  .photo-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #e2e8f0; }
  .photo-pair .carousel { position: relative; }
  .photo-pair img { min-height: 120px; max-height: 280px; }
  .photo-pair .lbl {
    position: absolute; top: 6px; left: 6px; z-index: 2; pointer-events: none;
    background: rgba(31,43,19,.78);
    color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }
  .photo-pair .car-btn { width: 30px; height: 30px; line-height: 30px; font-size: 16px; }
  .photo-pair .car-count { top: auto; bottom: 8px; right: 6px; padding: 2px 8px; }

  .choice-row { display: flex; gap: 10px; }
  .choice-row button {
    flex: 1; border: 2px solid #d3dcc3; background: #fff; border-radius: 14px;
    padding: 16px 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all .15s;
  }
  .choice-row button.active { border-color: var(--green); background: var(--lime-soft); color: var(--blue); }
  .choice-row .big { display: block; font-size: 34px; margin-bottom: 4px; }

  /* background upload progress pill */
  #upload-pill {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 40;
    background: var(--header); color: #fff; border: 1px solid var(--lime);
    border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 700;
    display: none; white-space: nowrap;
  }

  /* ---------- toast & spinner ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: var(--header); color: #fff; border: 1px solid var(--lime);
    padding: 12px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; z-index: 90; display: none; max-width: 90%;
  }
  #spinner {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; background: rgba(244,249,234,.75);
  }
  #spinner .spin-box {
    background: #fff; border-radius: 18px; padding: 22px 28px; text-align: center;
    box-shadow: 0 8px 28px rgba(31,43,19,.2);
  }
  #spinner .ring {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px;
    border: 6px solid var(--lime-soft); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  #spinner-txt { font-size: 14px; font-weight: 700; color: var(--blue); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70;
    display: none; align-items: center; justify-content: center;
    touch-action: none;
  }
  .viewer.show { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; }
  .viewer .viewer-x {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    background: rgba(255,255,255,.18); color: #fff;
  }
  .viewer .car-btn { display: block; z-index: 2; }
  #viewer-prev { left: 10px; }
  #viewer-next { right: 10px; }
  #viewer-count {
    position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 14px; font-weight: 800; z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
  }

  /* ================= DESKTOP ================= */
  @media (min-width: 700px) {
    .page { max-width: 1100px; padding: 20px 24px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    nav {
      left: 50%; right: auto; transform: translateX(-50%);
      width: 480px; bottom: 18px; border-radius: 999px;
      border: 1px solid #e2e8f0; box-shadow: 0 8px 28px rgba(15,23,42,.18);
      overflow: hidden; padding-bottom: 0;
    }
    nav button { padding: 10px 0 12px; }
    .pills button { padding: 10px 22px; }
    .stack-outer { max-width: 440px; }
    #scroller { padding-bottom: 160px; }
    .card { transition: box-shadow .15s, transform .15s; }
    .card:hover { box-shadow: 0 6px 18px rgba(31,43,19,.16); transform: translateY(-2px); }
  }
  @media (min-width: 1050px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>

<div id="scroller">
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg">
        <path d="M39 7 L12 21 L3 47 L23 55 L27 43 L27 99 Q27 106 34 106 L86 106 Q93 106 93 99 L93 43 L97 55 L117 47 L108 21 L81 7 Q73 17 60 17 Q47 17 39 7 Z"
              fill="#b7e388" stroke="#161a10" stroke-width="9" stroke-linejoin="round"/>
        <path d="M93 106 L93 80 L67 106 Z" fill="#f18bb9" stroke="#161a10" stroke-width="7" stroke-linejoin="round"/>
      </svg>
      ARA<span class="dot">MEGA</span>
    </h1>
    <button class="role-btn" id="refresh-btn" onclick="manualRefresh()">Refresh</button>
    <button class="role-btn" id="cleardone-btn" onclick="askClearDone()">✅ CLEAR DONE</button>
    <button class="role-btn" id="reset-btn" onclick="askReset()">🧹 RESET</button>
    <button class="role-btn" id="role-btn" onclick="openRoleModal()">👷 Staff</button>
    <div id="sync-row"></div>
  </header>

  <!-- ================= TAB 1 : CHECKING (Kilang Want) ================= -->
  <div class="page" id="page-want">
    <div id="want-stack-area"></div>
    <div id="want-responded"></div>
  </div>

  <!-- ================= TAB 2 : DELIVERY (Kilang Packing) ================= -->
  <div class="page" id="page-delivery">
    <div class="pills" id="delivery-pills">
      <button data-cat="" class="active">All</button>
      <button data-cat="lalamove">🛵 Lalamove</button>
      <button data-cat="bus">🚌 Bus</button>
      <button data-cat="pickup">🤝 Pickup</button>
    </div>
    <div id="delivery-list"></div>
  </div>

  <!-- ================= TAB 3 : POSTAGE ================= -->
  <div class="page" id="page-postage">
    <div id="postage-list"></div>
